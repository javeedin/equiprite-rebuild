<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header style="font-family: 'Source Sans 3', system-ui, sans-serif; color: #111827; background: #ffffff; border-bottom: 1px solid #e5e7eb; min-height: 64px; box-sizing: border-box; padding: 8px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
  <div style="display: flex; align-items: center; gap: 10px">
    <button type="button" aria-label="Show or hide menu" style="width: 40px; height: 40px; border: 0; border-radius: 6px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
    <a href="HomeEquipmentManager.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #111827">
      <span style="width: 28px; height: 28px; border-radius: 6px; background: #2e5468; color: #ffffff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center" aria-hidden="true">ER</span>
      <span style="font-weight: 700; font-size: 18px">EquipRite</span>
    </a>
  </div>

  <label style="flex: 1 1 320px; min-width: 0; position: relative; display: flex; align-items: center">
    <span style="position: absolute; left: -9999px">Search</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" style="position: absolute; left: 12px" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <input type="search" placeholder="Search equipment, requests, projects" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px 0 36px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; font-size: 15px; background: #f8fafc">
  </label>

  <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
    <button type="button" style="height: 40px; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #ffffff; font: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2e5468" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
      <span style="color: #475569">Region / Org</span>
      <strong>Houston Yard</strong>
      <span style="padding: 0 6px; border-radius: 999px; background: #e2e8f0; font-size: 12px">+1</span>
    </button>
    <a href="CartReview.dc.html" aria-label="Request cart, 3 items" style="position: relative; width: 40px; height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.5 12h11l2-8H6.2"></path></svg>
      <span style="position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; border-radius: 999px; background: #1d4ed8; color: #ffffff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span>
    </a>
    <button type="button" aria-label="Notifications, 5 unread" style="position: relative; width: 40px; height: 40px; border: 0; border-radius: 6px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg>
      <span style="position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; border-radius: 999px; background: #b91c1c; color: #ffffff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">5</span>
    </button>
    <button type="button" aria-label="User menu: profile, my watched equipment, sign out" style="width: 40px; height: 40px; border: 0; border-radius: 999px; background: #334155; color: #ffffff; font: inherit; font-weight: 700; cursor: pointer">JD</button>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

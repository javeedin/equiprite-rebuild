<style>
  #projectQuotePageOverview { --oj-sp-general-overview-page-max-width: 100% !important; width: 100% !important; max-width: min(2400px, calc(100vw - 48px)) !important; margin: 0 auto !important; }

  /* ── Accept-in-progress overlay ──────────────────────────────────────────
     Deliberately lighter wording than the customer page's: no Fusion contract
     is created here, so this is a fast status advance, not a long integration
     call. Kept as an overlay purely to block a double-click on Accept. */
  .pq-accept-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(1px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .pq-accept-box {
    background: #fff;
    border: 1px solid var(--oj-core-divider-color, #e0e0e0);
    border-radius: 10px;
    padding: 28px 40px;
    box-shadow: 0 6px 28px rgba(0, 0, 0, 0.14);
    text-align: center;
    max-width: 340px;
  }
  .pq-accept-spinner {
    width: 42px;
    height: 42px;
    margin: 0 auto 16px auto;
    border: 4px solid var(--oj-core-neutral-color-3, #e0e0e0);
    border-top-color: var(--oj-core-brand-color-primary, #005cb1);
    border-radius: 50%;
    animation: pqSpin 0.8s linear infinite;
  }
  @keyframes pqSpin { to { transform: rotate(360deg); } }
  .pq-accept-text {
    font-size: 0.95rem;
    font-weight: 600;
    color: #1e293b;
    margin-bottom: 4px;
  }
  .pq-accept-subtext {
    font-size: 0.8rem;
    color: var(--oj-core-text-color-secondary, #565656);
    line-height: 1.5;
  }
</style>

<oj-sp-general-overview-page
  id="projectQuotePageOverview"
  class="oj-sm-width-full"
  page-title="[[ 'Quote — ' + $variables.requestId ]]"
  display-mode="mixed"
  display-options.in-flow-back="true"
  on-sp-in-flow-back="[[ $listeners.onBack ]]">

  <div slot="main" style="width:100%; padding: 0 16px 32px 16px;">

    <!-- Accept in progress — blocks a second click while the PATCHes run. -->
    <oj-bind-if test="[[ $variables.isAccepting ]]">
      <div class="pq-accept-overlay">
        <div class="pq-accept-box">
          <div class="pq-accept-spinner"></div>
          <div class="pq-accept-text">Accepting the quote…</div>
          <div class="pq-accept-subtext">Approving the cost estimate and advancing the request. Please don't close this page.</div>
        </div>
      </div>
    </oj-bind-if>

    <!-- Loading state -->
    <oj-bind-if test="[[ $variables.isLoading ]]">
      <div style="text-align:center; padding:60px 0; color:var(--oj-core-text-color-secondary,#565656);">
        Loading quote...
      </div>
    </oj-bind-if>

    <oj-bind-if test="[[ !$variables.isLoading ]]">

      <!-- The persisted PDF is the quote — same Option A shape as the customer
           page: the document the manager sent IS the artefact, nothing is
           recomputed client-side. -->
      <oj-bind-if test="[[ $variables.hasQuoteDoc ]]">

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-bottom:16px;">
          <oj-button chroming="outlined"
            on-oj-action="[[ function() { window.open($variables.quotePdfUrl, '_blank'); } ]]" display="all" class="oj-button-sm">
            <span slot="startIcon" class="oj-ux-ico-download"></span>
            <span>Download PDF</span>
          </oj-button>
          <!-- Accept is live ONLY at QUOTE_GENERATED. Once accepted (or further
               downstream) the button stays visible but disabled, so revisiting
               the page reads as "already accepted" rather than offering a
               no-op that would re-PATCH statuses. -->
          <oj-button chroming="callToAction"
            on-oj-action="[[ $listeners.onAcceptQuote ]]" display="all" class="oj-button-sm"
            :disabled="[[ $variables.requestStatus !== 'QUOTE_GENERATED' || $variables.isAccepting || !$variables.acceptAllowed ]]">
            <span slot="startIcon" class="oj-ux-ico-check-circle-s"></span>
            <span><oj-bind-text value="[[
              $variables.isAccepting ? 'Accepting…' :
              $variables.requestStatus !== 'QUOTE_GENERATED' ? 'Quote Accepted' :
              !$variables.acceptAllowed ? 'Quote Acceptance Disabled' : 'Accept Quote'
            ]]"></oj-bind-text></span>
          </oj-button>
        </div>

        <!-- The exact PDF the manager sent -->
        <iframe :src="[[ $variables.quotePdfUrl ]]" title="Equipment Rental Quote"
          style="width:100%; height:80vh; border:1px solid var(--oj-core-divider-color,#e0e0e0); border-radius:8px; background:#fff;"></iframe>

      </oj-bind-if>

      <!-- No saved quote document — the manager hasn't sent one yet (the
           endpoint 404s until quoteDocument is populated). -->
      <oj-bind-if test="[[ !$variables.hasQuoteDoc ]]">
        <div style="text-align:center; padding:60px 16px; color:var(--oj-core-text-color-secondary,#565656);">
          <div style="font-size:40px; color:#cbd5e1; margin-bottom:12px;">📄</div>
          <div style="font-size:15px; font-weight:600; color:#475569;">No quote document is available for this request yet.</div>
        </div>
      </oj-bind-if>

    </oj-bind-if>

  </div>
</oj-sp-general-overview-page>

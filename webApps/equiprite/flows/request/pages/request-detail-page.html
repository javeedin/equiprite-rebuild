<!-- Request detail (wireframe: Request detail). Data: initChain; actions: the old page's chains on the ticked lines. -->
<div class="er-band">
  <div class="er-band-inner">
    <div>
      <div class="er-band-kicker">
        <button type="button" class="er-link-inverse" on-click="[[ $listeners.onBack ]]">My requests</button>
        ·
        <oj-bind-text value="[[ $variables.formData.isCustomer ? 'Customer request' : 'Project request' ]]"></oj-bind-text>
      </div>
      <h1>
        <oj-bind-text value="[[ $variables.formData.requestNumber || $variables.requestId || 'Request' ]]"></oj-bind-text>
        <oj-bind-if test="[[ !!$variables.formData.status ]]">
          <!-- Where the request is, from its equipment; the stored request status is in the tooltip. -->
          <span :class="[[ 'er-stagepill er-band-pill er-stage--' + $functions.progress($variables.formData.status, $variables.dataGridProvider, $variables.formData).tone ]]"
            :title="[[ 'Request status: ' + $application.functions.formatLineStatus($variables.formData.status) ]]">
            <oj-bind-text value="[[ $functions.progress($variables.formData.status, $variables.dataGridProvider, $variables.formData).headline ]]"></oj-bind-text>
          </span>
        </oj-bind-if>
      </h1>
      <div class="er-band-sub">
        <oj-bind-text value="[[ $variables.formData.isCustomer
          ? ($variables.formData.customerName || '') + ($variables.formData.contactName ? ' · ' + $variables.formData.contactName : '')
          : ($variables.formData.project || '') + ($variables.formData.task ? ' · ' + $variables.formData.task : '') ]]"></oj-bind-text>
      </div>
    </div>
    <div class="er-actions">
      <oj-bind-if test="[[ $variables.formData.status === 'QUOTE_GENERATED' || $variables.formData.status === 'QUOTE_ACCEPTED' ]]">
        <a class="er-btn er-btn--ghost" :href="[[ $functions.oldQuoteLink($application.variables.oldAppUrl, $variables.requestId,
                                                  $variables.requestNumericId, $variables.formData.isCustomer) ]]">View quote</a>
      </oj-bind-if>
      <oj-bind-if test="[[ $variables.formData.status === 'DRAFT' ]]">
        <button type="button" class="er-btn er-btn--ghost" :disabled="[[ $variables.isDraftBusy ]]"
          on-click="[[ $listeners.onAskDeleteDraft ]]">Delete draft</button>
        <button type="button" class="er-btn er-btn--ghost" :disabled="[[ $variables.isDraftBusy ]]"
          on-click="[[ $listeners.onEditDraft ]]">Edit draft</button>
        <button type="button" class="er-btn er-btn--primary" :disabled="[[ $variables.isDraftBusy ]]"
          on-click="[[ $listeners.onSubmitDraft ]]">Submit draft</button>
      </oj-bind-if>
      <oj-bind-if test="[[ $functions.oldDetailLink($application.variables.oldAppUrl, $variables.requestId, $variables.requestNumericId, $variables.formData.isCustomer) ]]">
        <a class="er-btn er-btn--ghost" title="The same request in today's app"
          :href="[[ $functions.oldDetailLink($application.variables.oldAppUrl, $variables.requestId,
                                             $variables.requestNumericId, $variables.formData.isCustomer) ]]">Old view</a>
      </oj-bind-if>
    </div>
  </div>
  <div class="er-strip" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
</div>

<div class="er-page">
  <oj-bind-if test="[[ !!$variables.fetchError ]]">
    <div class="er-error" role="alert"><oj-bind-text value="[[ $variables.fetchError ]]"></oj-bind-text></div>
  </oj-bind-if>
  <oj-bind-if test="[[ $variables.isLoading ]]">
    <div class="er-card er-card-pad er-muted">Loading the request…</div>
  </oj-bind-if>

  <oj-bind-if test="[[ !$variables.isLoading && !$variables.fetchError ]]">
    <!-- The journey of this request's equipment: how many pieces are at each stop, what is next, what is late. -->
    <section class="er-card er-card-pad er-journey" aria-labelledby="journeyTitle">
      <div class="er-journey-head">
        <h2 class="er-section-title" id="journeyTitle">
          <oj-bind-text value="[[ $functions.progress($variables.formData.status, $variables.dataGridProvider, $variables.formData).headline ]]"></oj-bind-text>
        </h2>
        <oj-bind-if test="[[ !!$functions.progress($variables.formData.status, $variables.dataGridProvider, $variables.formData).detail ]]">
          <span class="er-note"><oj-bind-text value="[[ $functions.progress($variables.formData.status, $variables.dataGridProvider, $variables.formData).detail ]]"></oj-bind-text></span>
        </oj-bind-if>
      </div>
      <ol class="er-jtrack" aria-label="Where the equipment is">
        <oj-bind-for-each data="[[ $functions.progress($variables.formData.status, $variables.dataGridProvider, $variables.formData).stops ]]">
          <template data-oj-as="stop">
            <li :class="[[ 'er-jstop er-jstop--' + stop.data.state + ' er-stage--' + stop.data.key ]]" :data-stop="[[ stop.data.key ]]"
              :aria-current="[[ stop.data.state === 'here' ? 'step' : 'false' ]]">
              <span class="er-jstop-bar" aria-hidden="true"></span>
              <span class="er-jstop-label"><oj-bind-text value="[[ stop.data.label ]]"></oj-bind-text></span>
              <span class="er-jstop-note"><oj-bind-text value="[[ $functions.stopNote(stop.data, $functions.progress($variables.formData.status, $variables.dataGridProvider, $variables.formData).total) ]]"></oj-bind-text></span>
            </li>
          </template>
        </oj-bind-for-each>
      </ol>
      <div class="er-journey-foot">
        <oj-bind-if test="[[ !!$functions.progress($variables.formData.status, $variables.dataGridProvider, $variables.formData).next ]]">
          <span class="er-mr-next"><strong>Next:</strong>
            <oj-bind-text value="[[ ($functions.progress($variables.formData.status, $variables.dataGridProvider, $variables.formData).next || {}).text ]]"></oj-bind-text></span>
        </oj-bind-if>
        <oj-bind-for-each data="[[ $functions.progress($variables.formData.status, $variables.dataGridProvider, $variables.formData).late ]]">
          <template data-oj-as="lt">
            <span class="er-mr-late"><span class="oj-ux-ico-warning" aria-hidden="true"></span>
              <oj-bind-text value="[[ lt.data.text ]]"></oj-bind-text></span>
          </template>
        </oj-bind-for-each>
      </div>
    </section>

    <section class="er-card er-card-pad">
      <dl class="er-facts">
        <div><dt>Requestor</dt><dd><oj-bind-text value="[[ $variables.formData.requestor || '—' ]]"></oj-bind-text></dd></div>
        <div><dt>Dates</dt><dd><oj-bind-text value="[[ ($variables.formData.startDate || '') + ' – ' + ($variables.formData.endDate || '') ]]"></oj-bind-text></dd></div>
        <div><dt>Deliver to</dt><dd><oj-bind-text value="[[ $variables.formData.location || '—' ]]"></oj-bind-text></dd></div>
        <oj-bind-if test="[[ $variables.formData.isCustomer ]]">
          <div><dt>Contract</dt><dd><oj-bind-text value="[[ $variables.formData.contractNumber || '—' ]]"></oj-bind-text></dd></div>
        </oj-bind-if>
        <div><dt>Lines</dt><dd><oj-bind-text value="[[ ($variables.dataGridProvider || []).length ]]"></oj-bind-text></dd></div>
      </dl>
    </section>

    <section class="er-card" aria-labelledby="linesTitle">
      <div class="er-card-pad er-table-head">
        <h2 class="er-section-title" id="linesTitle">Equipment</h2>
        <div class="er-actions">
          <span class="er-note">
            <oj-bind-text value="[[ $variables.selectionState.count
              ? $variables.selectionState.count + ' selected'
              : 'Tick lines to act on them' ]]"></oj-bind-text>
          </span>
          <oj-bind-if test="[[ $variables.formData.status === 'SUBMITTED' ]]">
            <button type="button" class="er-btn er-btn--plain" :disabled="[[ $variables.selectionState.count === 0 ]]"
              on-click="[[ $listeners.onReject ]]">Reject</button>
            <button type="button" class="er-btn er-btn--dark" :disabled="[[ $variables.selectionState.count === 0 ]]"
              on-click="[[ $listeners.onApprove ]]">Approve</button>
          </oj-bind-if>
          <oj-bind-if test="[[ $functions.headerIsConfirmed($variables.formData.status) ]]">
            <button type="button" class="er-btn er-btn--plain" :disabled="[[ !$variables.selectionState.allShipToSite ]]"
              on-click="[[ $listeners.onRejectDelivery ]]">Reject delivery</button>
            <button type="button" class="er-btn er-btn--plain" :disabled="[[ !$variables.selectionState.allShipToSite ]]"
              on-click="[[ $listeners.onAcceptDelivery ]]">Accept delivery</button>
            <button type="button" class="er-btn er-btn--dark" :disabled="[[ !$variables.selectionState.allReturnable ]]"
              on-click="[[ $listeners.onInitiateReturn ]]">Initiate return</button>
          </oj-bind-if>
        </div>
      </div>
      <!-- A div grid, not a <table>: the browser moves custom elements such as oj-bind-for-each out of <tbody>. -->
      <div class="er-table-wrap">
        <div class="er-grid" role="table" aria-labelledby="linesTitle">
          <div class="er-grid-row er-grid-head" role="row">
            <span role="columnheader" class="er-col-check">
              <input type="checkbox" data-index="all" aria-label="Select all lines" on-change="[[ $listeners.onToggleLine ]]"
                :checked="[[ $variables.selectionTick >= 0 && $variables.selectionState.allSelected ]]">
            </span>
            <span role="columnheader">Equipment</span><span role="columnheader">Qty</span><span role="columnheader">Dates</span>
            <span role="columnheader">Serial</span><span role="columnheader">Rate</span><span role="columnheader">Status</span>
          </div>
          <oj-bind-for-each data="[[ $variables.dataGridProvider ]]">
            <template data-oj-as="line">
              <div role="row" :class="[[ 'er-grid-row' + ($variables.selectionTick >= 0 && $functions.isRowSelected(line.index) ? ' er-row--on' : '') ]]">
                <span role="cell" class="er-col-check">
                  <input type="checkbox" :data-index="[[ line.index ]]" on-change="[[ $listeners.onToggleLine ]]"
                    :aria-label="[[ 'Select ' + line.data.equipmentName ]]"
                    :checked="[[ $variables.selectionTick >= 0 && $functions.isRowSelected(line.index) ]]">
                </span>
                <span role="cell">
                  <span class="er-cell-main"><oj-bind-text value="[[ line.data.equipmentName ]]"></oj-bind-text></span>
                  <span class="er-note">
                    <oj-bind-text value="[[ line.data.equipmentClass ]]"></oj-bind-text>
                    <oj-bind-if test="[[ line.data.isFromAgreement ]]">
                      · <span class="er-status er-status--agreement">Agreement <oj-bind-text value="[[ line.data.agreementNumber ]]"></oj-bind-text></span>
                    </oj-bind-if>
                  </span>
                </span>
                <span role="cell"><oj-bind-text value="[[ line.data.quantity ]]"></oj-bind-text></span>
                <span role="cell"><oj-bind-text value="[[ line.data.startDate + ' – ' + line.data.endDate ]]"></oj-bind-text></span>
                <span role="cell"><oj-bind-text value="[[ $functions.serialText(line.data) ]]"></oj-bind-text></span>
                <span role="cell"><oj-bind-text value="[[ line.data.billRate || '—' ]]"></oj-bind-text></span>
                <span role="cell">
                  <oj-bind-if test="[[ !!line.data.lineStatus ]]">
                    <span :class="[[ 'er-stagepill er-stage--' + $functions.lineStage(line.data.lineStatus, $variables.formData.isCustomer) ]]"
                      :title="[[ 'Line status: ' + $application.functions.formatLineStatus(line.data.lineStatus) ]]">
                      <oj-bind-text value="[[ $functions.lineLabel(line.data.lineStatus, $variables.formData.isCustomer) ]]"></oj-bind-text>
                    </span>
                  </oj-bind-if>
                </span>
              </div>
            </template>
          </oj-bind-for-each>
        </div>
      </div>
      <div class="er-card-pad er-note">
        Recording a cost or a material issue against a line is still in
        <oj-bind-if test="[[ $functions.oldDetailLink($application.variables.oldAppUrl, $variables.requestId, $variables.requestNumericId, $variables.formData.isCustomer) ]]">
          <a :href="[[ $functions.oldDetailLink($application.variables.oldAppUrl, $variables.requestId,
                                                $variables.requestNumericId, $variables.formData.isCustomer) ]]">Old EquipRite</a>.
        </oj-bind-if>
        <oj-bind-if test="[[ !$functions.oldDetailLink($application.variables.oldAppUrl, $variables.requestId, $variables.requestNumericId, $variables.formData.isCustomer) ]]">
          Old EquipRite.
        </oj-bind-if>
      </div>
    </section>
  </oj-bind-if>
</div>

<oj-dialog id="deleteDraftDialog" dialog-title="Delete draft?" initial-visibility="hide" cancel-behavior="icon"
  modality="modal" style="width: 420px;">
  <div slot="body">
    <oj-bind-text value="[[ 'Delete draft ' + ($variables.formData.requestNumber || '') + ' and all of its lines? This cannot be undone.' ]]"></oj-bind-text>
  </div>
  <div slot="footer" class="er-actions">
    <button type="button" class="er-btn er-btn--plain" on-click="[[ $listeners.onCancelDeleteDraft ]]">Cancel</button>
    <button type="button" class="er-btn er-btn--danger" :disabled="[[ $variables.isDraftBusy ]]"
      on-click="[[ $listeners.onDeleteDraft ]]">Delete</button>
  </div>
</oj-dialog>

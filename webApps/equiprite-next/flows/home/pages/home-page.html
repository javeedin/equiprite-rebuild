<!-- My work: what needs this persona now, their counts, their latest requests, where they start. (myWork.js) -->
<div class="nx-page nx-work" id="page-home">
  <div class="nx-pagehead">
    <div>
      <div class="nx-kicker"><oj-bind-text value="[[ $functions.today() ]]"></oj-bind-text></div>
      <h1><oj-bind-text value="[[ $functions.greeting($application.user, $application.functions) ]]"></oj-bind-text></h1>
      <div class="nx-sub"><oj-bind-text value="[[ $variables.persona ? 'Your work as ' + $application.functions.personaLabel($variables.persona) : '' ]]"></oj-bind-text></div>
    </div>
    <div class="nx-actions">
      <label class="nx-search nx-work-find">
        <span class="oj-ux-ico-file-text" aria-hidden="true"></span>
        <input type="search" id="workFind" :value="[[ $variables.find ]]" on-keyup="[[ $listeners.onFind ]]"
          placeholder="Open a request: type its number, Enter" aria-label="Open a request by number">
      </label>
      <button type="button" class="nx-btn nx-btn--plain" on-click="[[ $listeners.onRefresh ]]" :disabled="[[ $variables.isLoading ]]">
        <span class="oj-ux-ico-refresh" aria-hidden="true"></span>Refresh</button>
    </div>
  </div>

  <oj-bind-if test="[[ $variables.personas.length > 1 ]]">
    <div class="nx-chips" role="group" aria-label="View work as">
      <span class="nx-note nx-viewas">View as</span>
      <oj-bind-for-each data="[[ $variables.personas ]]">
        <template data-oj-as="p">
          <button type="button" :data-persona="[[ p.data.code ]]" on-click="[[ $listeners.onPersona ]]"
            :aria-pressed="[[ $variables.persona === p.data.code ? 'true' : 'false' ]]"
            :class="[[ 'nx-chip' + ($variables.persona === p.data.code ? ' nx-chip--on' : '') ]]"><oj-bind-text value="[[ p.data.label ]]"></oj-bind-text></button>
        </template>
      </oj-bind-for-each>
    </div>
  </oj-bind-if>

  <oj-bind-if test="[[ !!$variables.error ]]"><div class="nx-error" role="alert"><oj-bind-text value="[[ $variables.error ]]"></oj-bind-text></div></oj-bind-if>

  <div class="nx-kpis" role="group" aria-label="Your counts">
    <oj-bind-for-each data="[[ $variables.work.tiles ]]">
      <template data-oj-as="t">
        <button type="button" :class="[[ 'nx-kpi nx-stage--' + t.data.tone ]]" :data-tile="[[ t.data.key ]]" :data-nav="[[ t.data.navId ]]" on-click="[[ $listeners.onOpen ]]">
          <span class="nx-kpi-label"><oj-bind-text value="[[ t.data.label ]]"></oj-bind-text></span>
          <span class="nx-kpi-value"><oj-bind-text value="[[ $variables.isLoading && !$variables.work.recent.length ? '…' : t.data.value ]]"></oj-bind-text></span>
          <span class="nx-kpi-note"><oj-bind-text value="[[ t.data.note ]]"></oj-bind-text></span>
        </button>
      </template>
    </oj-bind-for-each>
  </div>

  <div class="nx-work-cols">
    <section class="nx-card" aria-labelledby="needsTitle">
      <div class="nx-card-head"><h2 id="needsTitle">Needs you</h2>
        <span class="nx-note"><oj-bind-text value="[[ $variables.work.needs.length ? $variables.work.needs.length + (($variables.work.needs.length === 1) ? ' thing' : ' things') : '' ]]"></oj-bind-text></span></div>
      <oj-bind-if test="[[ !$variables.isLoading && !$variables.work.needs.length ]]">
        <p class="nx-empty"><span class="oj-ux-ico-check-circle nx-ok-icon" aria-hidden="true"></span> Nothing needs you right now.</p>
      </oj-bind-if>
      <ul class="nx-needs">
        <oj-bind-for-each data="[[ $variables.work.needs ]]">
          <template data-oj-as="n">
            <li>
              <button type="button" :class="[[ 'nx-need nx-need--' + n.data.kind ]]" :data-nav="[[ n.data.open && n.data.open.navId ? n.data.open.navId : '' ]]"
                :data-id="[[ n.data.open && n.data.open.params ? (n.data.open.params.id || '') : '' ]]"
                :data-number="[[ n.data.open && n.data.open.params ? (n.data.open.params.number || '') : '' ]]" on-click="[[ $listeners.onOpen ]]">
                <span :class="[[ (n.data.kind === 'late' ? 'oj-ux-ico-warning' : 'oj-ux-ico-bell-ring') + ' nx-need-icon' ]]" aria-hidden="true"></span>
                <span class="nx-need-body"><span class="nx-need-title"><oj-bind-text value="[[ n.data.title ]]"></oj-bind-text></span>
                  <span class="nx-need-text"><oj-bind-text value="[[ n.data.text ]]"></oj-bind-text></span></span>
                <span class="oj-ux-ico-chevron-right nx-need-go" aria-hidden="true"></span>
              </button>
            </li>
          </template>
        </oj-bind-for-each>
      </ul>
    </section>

    <div class="nx-work-side">
      <section class="nx-card" aria-labelledby="startTitle">
        <div class="nx-card-head"><h2 id="startTitle">Start from</h2></div>
        <div class="nx-shortcuts">
          <oj-bind-for-each data="[[ $variables.work.actions ]]">
            <template data-oj-as="a">
              <button type="button" class="nx-shortcut" :data-nav="[[ a.data ]]" on-click="[[ $listeners.onOpen ]]">
                <span :class="[[ $functions.item(a.data).icon + ' nx-shortcut-icon' ]]" aria-hidden="true"></span>
                <span><oj-bind-text value="[[ $functions.item(a.data).label ]]"></oj-bind-text></span>
              </button>
            </template>
          </oj-bind-for-each>
        </div>
      </section>
    </div>
  </div>

  <section class="nx-card" aria-labelledby="recentTitle">
    <div class="nx-card-head"><h2 id="recentTitle">Latest requests</h2>
      <button type="button" class="nx-linkbtn" data-nav="requests" on-click="[[ $listeners.onOpen ]]">All requests</button></div>
    <oj-bind-if test="[[ !$variables.isLoading && !$variables.work.recent.length ]]"><p class="nx-empty">No requests yet.</p></oj-bind-if>
    <div class="nx-table">
      <div class="nx-grid nx-grid--recent" role="table" aria-labelledby="recentTitle">
        <oj-bind-for-each data="[[ $variables.work.recent ]]">
          <template data-oj-as="r">
            <div role="row" class="nx-row nx-row--click" :data-id="[[ r.data.eqrEquipmentRequestId ]]" :data-number="[[ r.data.requestNumber ]]" on-click="[[ $listeners.onOpen ]]">
              <span role="cell"><button type="button" class="nx-link"><oj-bind-text value="[[ r.data.requestNumber ]]"></oj-bind-text></button></span>
              <span role="cell" class="nx-ellipsis"><oj-bind-text value="[[ r.data.party || '—' ]]"></oj-bind-text></span>
              <span role="cell"><span :class="[[ 'nx-pill nx-stage--' + r.data.p.tone ]]"><oj-bind-text value="[[ r.data.p.headline ]]"></oj-bind-text></span></span>
              <span role="cell">
                <oj-bind-if test="[[ r.data.segs.length > 0 ]]">
                  <span class="nx-jbar" aria-hidden="true">
                    <oj-bind-for-each data="[[ r.data.segs ]]"><template data-oj-as="s"><span :class="[[ 'nx-jbar-seg nx-stage--' + s.data.stage ]]"></span></template></oj-bind-for-each>
                  </span>
                </oj-bind-if>
              </span>
              <span role="cell" class="nx-num nx-ellipsis"><oj-bind-text value="[[ r.data.dates ]]"></oj-bind-text></span>
              <span role="cell" class="nx-ellipsis nx-muted"><oj-bind-text value="[[ r.data.p.next ? r.data.p.next.text : '' ]]"></oj-bind-text></span>
            </div>
          </template>
        </oj-bind-for-each>
      </div>
    </div>
  </section>
</div>

<!-- Everything about a piece of equipment: an item with all its units, or one unit. Where each unit is and what it is
     doing now, its availability ahead (Availability's timeline: bars placed by percentage of the days shown, so it fits
     any width), and its full history newest first, each entry opening its record. Logic: resources/js/equipment360.js;
     styles: resources/css/next-equipment-360.css (and Availability's .nx-av-* timeline). Reads only. -->
<div class="nx-page nx-e3" :data-key="[[ $variables.key ]]" :data-mode="[[ $variables.mode ]]">
  <div class="nx-pagehead nx-e3-head">
    <div class="nx-e3-headmain">
      <oj-bind-if test="[[ !!$variables.head.image ]]">
        <img class="nx-e3-pic" :src="[[ $functions.imageSrc($variables.head.image, $application.path) ]]" :alt="[[ $variables.head.name || 'The equipment' ]]">
      </oj-bind-if>
      <div class="nx-e3-headtext">
        <div class="nx-kicker"><oj-bind-text value="[[ $variables.head.kicker || 'Equipment' ]]"></oj-bind-text></div>
        <h1 class="nx-record-title nx-e3-title">
          <span class="nx-e3-name"><oj-bind-text value="[[ $variables.head.title || $variables.serial || $variables.unit || $variables.name || 'Equipment' ]]"></oj-bind-text></span>
          <oj-bind-if test="[[ !!$variables.head.now ]]">
            <span :class="[[ ($variables.head.now ? $variables.head.now.cls : '') + ' nx-record-pill nx-e3-nowpill' ]]" :title="[[ $variables.head.now ? $variables.head.now.text : '' ]]">
              <oj-bind-text value="[[ $variables.head.now ? $variables.head.now.label : '' ]]"></oj-bind-text></span>
          </oj-bind-if>
        </h1>
        <div class="nx-sub nx-e3-sub"><oj-bind-text value="[[ $variables.isLoading && !$variables.head.title ? 'Reading the equipment, its units and its bookings…' : $variables.head.sub ]]"></oj-bind-text></div>
        <oj-bind-if test="[[ !!$variables.head.where ]]">
          <div class="nx-sub nx-e3-where"><oj-bind-text value="[[ $variables.head.where ]]"></oj-bind-text>
            <oj-bind-if test="[[ !!($variables.head.now && $variables.head.now.text) ]]"><span><oj-bind-text value="[[ ' · ' + ($variables.head.now ? $variables.head.now.text : '') ]]"></oj-bind-text></span></oj-bind-if>
          </div>
        </oj-bind-if>
        <oj-bind-if test="[[ $functions.arr($variables.head.facts).length > 0 ]]">
          <ul class="nx-e3-facts" aria-label="About it">
            <oj-bind-for-each data="[[ $functions.arr($variables.head.facts) ]]">
              <template data-oj-as="f"><li class="nx-e3-fact"><oj-bind-text value="[[ f.data ]]"></oj-bind-text></li></template>
            </oj-bind-for-each>
          </ul>
        </oj-bind-if>
        <oj-bind-if test="[[ $variables.head.mode === 'unit' && !!$variables.head.equipmentId ]]">
          <button type="button" class="nx-link nx-e3-all" data-kind="item" on-click="[[ $listeners.onOpen ]]">
            <span class="oj-ux-ico-arrow-left" aria-hidden="true"></span><oj-bind-text value="[[ $variables.head.allText ]]"></oj-bind-text></button>
        </oj-bind-if>
      </div>
    </div>
    <div class="nx-actions">
      <button type="button" class="nx-btn nx-btn--plain" on-click="[[ $listeners.onRefresh ]]" :disabled="[[ $variables.isLoading ]]">
        <span class="oj-ux-ico-refresh" aria-hidden="true"></span>Refresh</button>
      <button type="button" class="nx-btn nx-e3-toav" data-kind="availability" on-click="[[ $listeners.onOpen ]]" :disabled="[[ !$variables.head.title ]]"
        title="Availability, searched for this equipment: every unit and booking beside the rest of the fleet">
        <span class="oj-ux-ico-calendar" aria-hidden="true"></span>Open in Availability</button>
      <div class="nx-export">
        <button type="button" class="nx-btn nx-e3-export" data-field="exportOpen" data-value="toggle" on-click="[[ $listeners.onPick ]]" aria-haspopup="menu"
          :aria-expanded="[[ $variables.exportOpen ? 'true' : 'false' ]]" :disabled="[[ !$variables.model ]]">
          <span class="oj-ux-ico-download" aria-hidden="true"></span>Export<span class="oj-ux-ico-chevron-down" aria-hidden="true"></span></button>
        <oj-bind-if test="[[ $variables.exportOpen ]]">
          <div class="nx-menu nx-e3-menu" role="menu" aria-label="Export">
            <p class="nx-e3-menuhead"><oj-bind-text value="[[ 'The history (' + $variables.hv.rows.length + ' entries, as shown)' ]]"></oj-bind-text></p>
            <oj-bind-for-each data="[[ $functions.formats() ]]">
              <template data-oj-as="f">
                <button type="button" role="menuitem" class="nx-menu-item" data-what="history" :data-format="[[ f.data.key ]]" on-click="[[ $listeners.onExport ]]"
                  :disabled="[[ $variables.hist.loading ]]">
                  <span :class="[[ f.data.icon ]]" aria-hidden="true"></span><oj-bind-text value="[[ f.data.label ]]"></oj-bind-text></button>
              </template>
            </oj-bind-for-each>
            <p class="nx-e3-menuhead"><oj-bind-text value="[[ 'The units (' + $variables.view.units.length + ', in your window ' + $variables.view.winText + ')' ]]"></oj-bind-text></p>
            <oj-bind-for-each data="[[ $functions.formats() ]]">
              <template data-oj-as="f">
                <button type="button" role="menuitem" class="nx-menu-item" data-what="units" :data-format="[[ f.data.key ]]" on-click="[[ $listeners.onExport ]]">
                  <span :class="[[ f.data.icon ]]" aria-hidden="true"></span><oj-bind-text value="[[ f.data.label ]]"></oj-bind-text></button>
              </template>
            </oj-bind-for-each>
          </div>
        </oj-bind-if>
      </div>
    </div>
  </div>

  <oj-bind-if test="[[ $variables.isLoading && !$variables.head.title && !$variables.error ]]">
    <div class="nx-card nx-empty" role="status"><span class="nx-spin" aria-hidden="true"></span> Loading the equipment, its units and its bookings…</div>
  </oj-bind-if>
  <oj-bind-if test="[[ !!$variables.error ]]">
    <div class="nx-error nx-e3-error" role="alert"><oj-bind-text value="[[ $variables.error ]]"></oj-bind-text></div>
  </oj-bind-if>
  <oj-bind-for-each data="[[ $variables.notes ]]">
    <template data-oj-as="n"><div class="nx-error nx-e3-note" role="status"><oj-bind-text value="[[ n.data ]]"></oj-bind-text></div></template>
  </oj-bind-for-each>

  <oj-bind-if test="[[ !!$variables.model && !$variables.error ]]">
    <!-- ── The units: where each is, what it is doing now, what is next, free or not in the window ─────────────── -->
    <section class="nx-card nx-e3-units" aria-labelledby="e3UnitsTitle">
      <div class="nx-card-head">
        <h2 id="e3UnitsTitle"><oj-bind-text value="[[ $functions.unitsTitle($variables.mode, $variables.view.units.length) ]]"></oj-bind-text></h2>
        <span class="nx-note"><oj-bind-text value="[[ 'In your window: ' + $variables.view.winText ]]"></oj-bind-text></span>
      </div>
      <oj-bind-if test="[[ !$variables.view.units.length ]]">
        <div class="nx-empty">No units of this equipment are recorded in EquipRite.</div>
      </oj-bind-if>
      <oj-bind-if test="[[ $variables.view.units.length > 0 ]]">
        <div class="nx-table">
          <div class="nx-grid nx-e3-ugrid" role="table" aria-labelledby="e3UnitsTitle">
            <div class="nx-row nx-row--head" role="row">
              <span role="columnheader">Unit</span><span role="columnheader">Yard</span><span role="columnheader">Now</span>
              <span role="columnheader">Next booking</span><span role="columnheader">In your window</span>
            </div>
            <oj-bind-for-each data="[[ $variables.view.units ]]">
              <template data-oj-as="u">
                <div class="nx-row nx-e3-urow" role="row" :data-unit="[[ u.data.serial ]]">
                  <span role="cell" class="nx-e3-ucell">
                    <oj-bind-if test="[[ $variables.mode === 'item' ]]">
                      <button type="button" class="nx-link nx-cell-main nx-e3-serial" data-kind="unit" :data-serial="[[ u.data.serial ]]" on-click="[[ $listeners.onOpen ]]"
                        :title="[[ 'Everything about ' + u.data.serial + ', in a tab of its own' ]]"><oj-bind-text value="[[ u.data.serial ]]"></oj-bind-text></button>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $variables.mode !== 'item' ]]">
                      <span class="nx-cell-main nx-e3-serial"><oj-bind-text value="[[ u.data.serial ]]"></oj-bind-text></span>
                    </oj-bind-if>
                    <span class="nx-cell-sub"><oj-bind-text value="[[ u.data.name + (u.data.known ? '' : ' · not in the unit list') ]]"></oj-bind-text></span>
                  </span>
                  <span role="cell" class="nx-e3-ucell"><span class="nx-e3-lbl">Yard</span><span class="nx-e3-yard"><oj-bind-text value="[[ u.data.yard ]]"></oj-bind-text></span></span>
                  <span role="cell" class="nx-e3-ucell nx-e3-now"><span class="nx-e3-lbl">Now</span>
                    <span :class="[[ u.data.now.cls ]]"><oj-bind-text value="[[ u.data.now.label ]]"></oj-bind-text></span>
                    <oj-bind-if test="[[ !!u.data.now.requestNumber ]]">
                      <button type="button" class="nx-link nx-cell-sub nx-e3-nowtext" data-kind="request" :data-id="[[ u.data.now.requestId ]]" :data-number="[[ u.data.now.requestNumber ]]"
                        on-click="[[ $listeners.onOpen ]]" :title="[[ 'Open ' + u.data.now.requestNumber + ' in a tab' ]]"><oj-bind-text value="[[ u.data.now.text ]]"></oj-bind-text></button>
                    </oj-bind-if>
                    <oj-bind-if test="[[ !u.data.now.requestNumber ]]">
                      <span class="nx-cell-sub nx-e3-nowtext"><oj-bind-text value="[[ u.data.now.text ]]"></oj-bind-text></span>
                    </oj-bind-if>
                  </span>
                  <span role="cell" class="nx-e3-ucell nx-e3-next"><span class="nx-e3-lbl">Next booking</span>
                    <oj-bind-if test="[[ !!u.data.next ]]">
                      <button type="button" class="nx-link nx-e3-nextbtn" data-kind="request" :data-id="[[ u.data.next ? u.data.next.requestId : '' ]]"
                        :data-number="[[ u.data.next ? u.data.next.requestNumber : '' ]]" on-click="[[ $listeners.onOpen ]]"><oj-bind-text value="[[ u.data.next ? u.data.next.text : '' ]]"></oj-bind-text></button>
                    </oj-bind-if>
                    <oj-bind-if test="[[ !u.data.next ]]"><span class="nx-muted">Nothing booked ahead</span></oj-bind-if>
                  </span>
                  <span role="cell" class="nx-e3-ucell nx-e3-win"><span class="nx-e3-lbl">In your window</span>
                    <span :class="[[ $functions.stateClass(u.data.win.state) ]]" :title="[[ u.data.win.title ]]"><oj-bind-text value="[[ u.data.win.label ]]"></oj-bind-text></span>
                    <span class="nx-cell-sub nx-e3-why"><oj-bind-text value="[[ u.data.win.why ]]"></oj-bind-text></span>
                  </span>
                </div>
              </template>
            </oj-bind-for-each>
          </div>
        </div>
      </oj-bind-if>
    </section>

    <!-- ── Availability ahead: your window, the answer, and each unit's bookings and maintenance as bars ───────── -->
    <section class="nx-card nx-av nx-av-tl nx-e3-ahead" aria-labelledby="e3AheadTitle">
      <div class="nx-e3-askhead">
        <h2 class="nx-h2" id="e3AheadTitle">Availability ahead</h2>
        <div class="nx-av-dates">
          <label class="nx-av-date"><span>From</span>
            <input type="date" class="nx-e3-from" :id="[[ 'e3From-' + $variables.uid ]]" :value="[[ $variables.from ]]" on-change="[[ $listeners.onFrom ]]"></label>
          <label class="nx-av-date"><span>To</span>
            <input type="date" class="nx-e3-to" :id="[[ 'e3To-' + $variables.uid ]]" :value="[[ $variables.to ]]" :min="[[ $variables.from ]]" on-change="[[ $listeners.onTo ]]"></label>
          <div class="nx-chips nx-av-presets" role="group" aria-label="Quick windows">
            <oj-bind-for-each data="[[ $functions.presets() ]]">
              <template data-oj-as="p">
                <button type="button" class="nx-chip" data-field="preset" :data-value="[[ p.data.days ]]" on-click="[[ $listeners.onPick ]]"><oj-bind-text value="[[ p.data.label ]]"></oj-bind-text></button>
              </template>
            </oj-bind-for-each>
          </div>
        </div>
        <p :class="[[ 'nx-av-answer nx-e3-answer nx-e3-answer--' + $variables.view.tone ]]" aria-live="polite"><oj-bind-text value="[[ $variables.view.answer ]]"></oj-bind-text></p>
        <p class="nx-note nx-e3-asknote"><oj-bind-text value="[[ $variables.view.winText + ' · free means no booking and no planned maintenance in EquipRite on those days.' + $functions.maintNote($variables.maint) ]]"></oj-bind-text></p>
      </div>
      <ul class="nx-av-legend" aria-label="What the colours mean">
        <oj-bind-for-each data="[[ $functions.legend() ]]">
          <template data-oj-as="k"><li><span :class="[[ k.data.cls ]]" aria-hidden="true"></span><oj-bind-text value="[[ k.data.label ]]"></oj-bind-text></li></template>
        </oj-bind-for-each>
      </ul>
      <oj-bind-if test="[[ $variables.view.rows.length > 0 ]]">
        <div :class="[[ 'nx-av-grid nx-e3-grid nx-av-grid--' + $variables.view.zoom ]]" role="table" aria-label="Each unit's bookings and maintenance">
          <div class="nx-av-row nx-av-row--head" role="row">
            <span class="nx-av-unit nx-av-unit--head" role="columnheader"><oj-bind-text value="[[ $variables.view.range.label ]]"></oj-bind-text></span>
            <div class="nx-av-track nx-av-track--head" role="columnheader" :aria-label="[[ $variables.view.range.label ]]">
              <div class="nx-av-months">
                <oj-bind-for-each data="[[ $variables.view.head.months ]]">
                  <template data-oj-as="mo"><span class="nx-av-month" :style="[[ { left: mo.data.l, width: mo.data.w } ]]"><oj-bind-text value="[[ mo.data.label ]]"></oj-bind-text></span></template>
                </oj-bind-for-each>
              </div>
              <div class="nx-av-ticks">
                <oj-bind-for-each data="[[ $variables.view.head.ticks ]]">
                  <template data-oj-as="tk">
                    <span :class="[[ 'nx-av-tick' + (tk.data.weekend ? ' nx-av-tick--weekend' : '') + (tk.data.win ? ' nx-av-tick--win' : '') + (tk.data.today ? ' nx-av-tick--today' : '') + (tk.data.mon ? ' nx-av-tick--mon' : '') ]]"
                      :style="[[ { left: tk.data.l, width: tk.data.w } ]]" :title="[[ tk.data.key ]]">
                      <oj-bind-if test="[[ !!tk.data.wd ]]"><span class="nx-av-wd"><oj-bind-text value="[[ tk.data.wd ]]"></oj-bind-text></span></oj-bind-if><oj-bind-text value="[[ tk.data.label ]]"></oj-bind-text></span>
                  </template>
                </oj-bind-for-each>
              </div>
            </div>
          </div>
          <div class="nx-av-body">
            <div :class="[[ 'nx-av-overlay nx-av-lines--' + $variables.view.zoom ]]" :style="[[ { backgroundSize: $variables.view.head.lines } ]]" aria-hidden="true">
              <oj-bind-if test="[[ !!$variables.view.head.band ]]">
                <span class="nx-av-band nx-e3-band" :style="[[ { left: $variables.view.head.band ? $variables.view.head.band.l : '0', width: $variables.view.head.band ? $variables.view.head.band.w : '0' } ]]"></span>
              </oj-bind-if>
              <oj-bind-if test="[[ !!$variables.view.head.today ]]">
                <span class="nx-av-today nx-e3-today" :style="[[ { left: $variables.view.head.today } ]]"></span>
              </oj-bind-if>
            </div>
            <oj-bind-for-each data="[[ $variables.view.rows ]]">
              <template data-oj-as="r">
                <div class="nx-av-row nx-av-row--unit nx-e3-trow" role="row" :data-unit="[[ r.data.serial ]]">
                  <div class="nx-av-unit" role="rowheader">
                    <span class="nx-av-unit-text">
                      <span class="nx-cell-main" :title="[[ r.data.name ]]"><oj-bind-text value="[[ r.data.serial ]]"></oj-bind-text></span>
                      <span class="nx-cell-sub"><oj-bind-text value="[[ r.data.sub ]]"></oj-bind-text></span>
                    </span>
                    <span class="nx-av-flags">
                      <span :class="[[ $functions.stateClass(r.data.state) ]]" :title="[[ r.data.stateTitle ]]"><oj-bind-text value="[[ r.data.stateLabel ]]"></oj-bind-text></span>
                    </span>
                  </div>
                  <div class="nx-av-track" role="cell" :style="[[ { height: r.data.h } ]]">
                    <oj-bind-for-each data="[[ r.data.marks ]]">
                      <template data-oj-as="mk"><span :class="[[ mk.data.cls ]]" :style="[[ { left: mk.data.l, width: mk.data.w } ]]" :title="[[ mk.data.title ]]"></span></template>
                    </oj-bind-for-each>
                    <oj-bind-for-each data="[[ r.data.bars ]]">
                      <template data-oj-as="b">
                        <oj-bind-if test="[[ b.data.open ]]">
                          <button type="button" :class="[[ b.data.cls ]]" :style="[[ { left: b.data.l, width: b.data.w, top: b.data.t } ]]" :title="[[ b.data.title ]]"
                            data-kind="request" :data-id="[[ b.data.requestId ]]" :data-number="[[ b.data.requestNumber ]]" on-click="[[ $listeners.onOpen ]]"><oj-bind-text value="[[ b.data.label ]]"></oj-bind-text></button>
                        </oj-bind-if>
                        <oj-bind-if test="[[ !b.data.open ]]">
                          <span :class="[[ b.data.cls ]]" :style="[[ { left: b.data.l, width: b.data.w, top: b.data.t } ]]" :title="[[ b.data.title ]]"><oj-bind-text value="[[ b.data.label ]]"></oj-bind-text></span>
                        </oj-bind-if>
                      </template>
                    </oj-bind-for-each>
                  </div>
                </div>
              </template>
            </oj-bind-for-each>
          </div>
        </div>
      </oj-bind-if>
    </section>

    <!-- ── History: everything that happened, newest first; each entry opens its record ───────────────────────── -->
    <section class="nx-card nx-card-pad nx-e3-hist" aria-labelledby="e3HistTitle">
      <div class="nx-journey-head">
        <h2 class="nx-h2" id="e3HistTitle"><span class="oj-ux-ico-clock-history" aria-hidden="true"></span> <oj-bind-text value="[[ $functions.histTitle($variables.hist, $variables.hv) ]]"></oj-bind-text></h2>
        <oj-bind-if test="[[ $variables.hist.loading ]]">
          <span class="nx-e3-busy" role="status"><span class="nx-spin" aria-hidden="true"></span>Reading the rest of its history…</span>
        </oj-bind-if>
      </div>
      <oj-bind-if test="[[ !!$variables.hist.failed ]]">
        <div class="nx-error nx-e3-failed" role="alert"><oj-bind-text value="[[ $variables.hist.failed ]]"></oj-bind-text></div>
      </oj-bind-if>
      <oj-bind-if test="[[ $functions.arr($variables.hist.chips).length > 0 ]]">
        <div class="nx-chips nx-e3-chips" role="group" aria-label="Show the history of">
          <oj-bind-for-each data="[[ $functions.arr($variables.hist.chips) ]]">
            <template data-oj-as="c">
              <button type="button" data-field="chip" :data-value="[[ c.data.key ]]" on-click="[[ $listeners.onPick ]]"
                :aria-pressed="[[ $variables.hv.chip === c.data.key ? 'true' : 'false' ]]" :class="[[ 'nx-chip' + ($variables.hv.chip === c.data.key ? ' nx-chip--on' : '') ]]">
                <oj-bind-text value="[[ c.data.label ]]"></oj-bind-text><span class="nx-chip-count"><oj-bind-text value="[[ c.data.count ]]"></oj-bind-text></span>
              </button>
            </template>
          </oj-bind-for-each>
        </div>
      </oj-bind-if>
      <oj-bind-if test="[[ !$variables.hist.loading && !$variables.hv.rows.length ]]">
        <p class="nx-note nx-e3-hempty"><oj-bind-text value="[[ $variables.hv.chip === 'all' ? 'Nothing has been recorded for this equipment yet.' : 'Nothing has been recorded for ' + $variables.hv.chip + ' yet.' ]]"></oj-bind-text></p>
      </oj-bind-if>
      <ul class="nx-e3-hlist" aria-label="Everything that happened, newest first">
        <oj-bind-for-each data="[[ $variables.hv.rows ]]">
          <template data-oj-as="e">
            <li :class="[[ 'nx-e3-h nx-e3-h--' + e.data.kind + ' nx-stage--' + e.data.stage ]]" :data-kind="[[ e.data.kind ]]" :data-rec="[[ e.data.rec ]]">
              <oj-bind-if test="[[ e.data.open ]]">
                <button type="button" class="nx-e3-hbtn" :data-kind="[[ e.data.rec ]]" :data-id="[[ e.data.recId ]]" :data-number="[[ e.data.recNumber ]]" :data-source="[[ e.data.recSource ]]"
                  on-click="[[ $listeners.onOpen ]]" :title="[[ 'Open ' + (e.data.recNumber || e.data.recId) + ' in a tab' ]]">
                  <span class="nx-e3-hdot" aria-hidden="true"></span>
                  <span class="nx-e3-hbody">
                    <span class="nx-e3-hkind"><oj-bind-text value="[[ e.data.kindLabel ]]"></oj-bind-text></span>
                    <span class="nx-e3-htitle"><oj-bind-text value="[[ e.data.title ]]"></oj-bind-text></span>
                    <oj-bind-if test="[[ !!e.data.text ]]"><span class="nx-e3-htext"><oj-bind-text value="[[ e.data.text ]]"></oj-bind-text></span></oj-bind-if>
                    <span class="nx-e3-hmeta"><oj-bind-text value="[[ e.data.meta ]]"></oj-bind-text></span>
                  </span>
                  <span class="nx-e3-hside">
                    <oj-bind-if test="[[ $variables.mode === 'item' && !!e.data.unitText ]]"><span class="nx-e3-hunit"><oj-bind-text value="[[ e.data.unitText ]]"></oj-bind-text></span></oj-bind-if>
                    <span class="nx-e3-hopen"><oj-bind-text value="[[ e.data.recNumber || 'Open' ]]"></oj-bind-text><span class="oj-ux-ico-chevron-right" aria-hidden="true"></span></span>
                  </span>
                </button>
              </oj-bind-if>
              <oj-bind-if test="[[ !e.data.open ]]">
                <div class="nx-e3-hbtn nx-e3-hbtn--still">
                  <span class="nx-e3-hdot" aria-hidden="true"></span>
                  <span class="nx-e3-hbody">
                    <span class="nx-e3-hkind"><oj-bind-text value="[[ e.data.kindLabel ]]"></oj-bind-text></span>
                    <span class="nx-e3-htitle"><oj-bind-text value="[[ e.data.title ]]"></oj-bind-text></span>
                    <oj-bind-if test="[[ !!e.data.text ]]"><span class="nx-e3-htext"><oj-bind-text value="[[ e.data.text ]]"></oj-bind-text></span></oj-bind-if>
                    <span class="nx-e3-hmeta"><oj-bind-text value="[[ e.data.meta ]]"></oj-bind-text></span>
                  </span>
                  <span class="nx-e3-hside">
                    <oj-bind-if test="[[ $variables.mode === 'item' && !!e.data.unitText ]]"><span class="nx-e3-hunit"><oj-bind-text value="[[ e.data.unitText ]]"></oj-bind-text></span></oj-bind-if>
                  </span>
                </div>
              </oj-bind-if>
            </li>
          </template>
        </oj-bind-for-each>
      </ul>
      <oj-bind-if test="[[ !!$variables.hist.note ]]">
        <p class="nx-note nx-e3-hnote"><oj-bind-text value="[[ $variables.hist.note ]]"></oj-bind-text></p>
      </oj-bind-if>
    </section>
  </oj-bind-if>
</div>

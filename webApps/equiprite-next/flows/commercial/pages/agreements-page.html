<!-- Agreements. Every rental agreement: what is active, what ends soon (within 60 days), what waits for approval,
     and the next step for each. Chips, search, sort, export; a row opens the agreement in its own tab. Rules:
     resources/js/agreementRules.js (New EquipRite's, unchanged); calls: agreements-page-chains. Redwood: Oracle's Smart
     Search page over an oj-table (resources/js/commercialRedwood.js). -->
<div class="nx-page nx-cm nx-agreements">
  <!-- ── Redwood (your menu, Look), as Old's Rental Agreements: Oracle's Smart Search page (Smart Search, a filter per
       column, oj-table, oj-badge, oj-c buttons) on the same agreements, search and chip as Current (applyChain,
       rwFilterChain); a row opens the agreement in its tab, as on Current. Put on the page the first time Redwood is
       shown, then kept, hidden under Current. ── -->
  <oj-bind-if test="[[ $application.variables.lookSeen ]]">
    <div class="nx-rw" id="agrRwList" :hidden="[[ $application.variables.look !== 'redwood' ]]">
      <oj-sp-smart-search-page page-title="Agreements" display-mode="mixed"
        page-subtitle="[[ $variables.unavailable ? 'Not available' : ($variables.isLoading && !$variables.rows.length ? 'Loading the agreements…' : $variables.summary) ]]"
        primary-action.display="[[ $variables.canWrite && !$variables.unavailable ? 'on' : 'off' ]]" primary-action.label="New agreement" on-sp-primary-action="[[ $listeners.onNew ]]">
        <oj-sp-smart-search slot="search" filter-criterion="{{ $variables.rwCriterion }}" on-filter-criterion-changed="[[ $listeners.onRwFilter ]]"
          search-context="[[ $variables.rwSearchContext ]]" search-config="[[ $variables.rwSearchConfig.provider ]]"
          suggestion-filters='["AgreementFilter", "CustomerFilter", "TypeFilter", "StatusFilter", "ValidFilter", "LinesFilter", "NextFilter"]' placeholder="Agreement, name, customer or type"></oj-sp-smart-search>
        <oj-sp-collection-container>
          <div class="nx-rw-tools">
            <oj-c-button id="agrRwRefresh" label="Refresh" chroming="borderless" size="sm" disabled="[[ $variables.isLoading || !!$variables.unavailable ]]" on-oj-action="[[ $listeners.onRefresh ]]">
              <span slot="startIcon" class="oj-ux-ico-refresh"></span></oj-c-button>
            <oj-c-button id="agrRwExport" label="Export to Excel" chroming="borderless" size="sm" disabled="[[ !!$variables.unavailable ]]" on-oj-action="[[ $listeners.onRwExport ]]">
              <span slot="startIcon" class="oj-ux-ico-download"></span></oj-c-button>
          </div>
          <oj-bind-if test="[[ !!$variables.error ]]">
            <div class="oj-sm-padding-4x-bottom" role="alert"><span class="oj-text-color-danger"><oj-bind-text value="[[ $variables.error ]]"></oj-bind-text></span></div>
          </oj-bind-if>
          <oj-table id="agrRwTable" data="[[ $variables.rwADP ]]" class="oj-sm-width-full nx-rw-table" aria-label="Agreements"
            scroll-policy="loadMoreOnScroll" scroll-policy-options.fetch-size="50" display="list" horizontal-grid-visible="enabled"
            layout="fixed" on-oj-row-action="[[ $listeners.onRwRow ]]"
            columns='[
              {"headerText": "Agreement", "field": "number", "template": "numTpl", "sortable": "enabled", "style": "width:15%", "weight": 15},
              {"headerText": "Customer", "field": "customer", "template": "customerTpl", "sortable": "enabled", "style": "width:14%", "weight": 14},
              {"headerText": "Type", "field": "type", "template": "typeTpl", "sortable": "enabled", "style": "width:11%", "weight": 11},
              {"headerText": "Status", "field": "status", "template": "statusTpl", "sortable": "enabled", "style": "width:10%", "weight": 10},
              {"headerText": "Valid", "field": "dates", "template": "validTpl", "sortable": "disabled", "style": "width:19%", "weight": 19},
              {"headerText": "Lines", "field": "lines", "template": "linesTpl", "sortable": "disabled", "style": "width:8%", "weight": 8},
              {"headerText": "Next step", "field": "next", "template": "nextTpl", "sortable": "disabled", "style": "width:23%", "weight": 23}
            ]'>
            <template slot="numTpl" data-oj-as="cell">
              <div class="nx-rw-cell"><span class="oj-typography-body-md oj-typography-bold oj-link-standalone nx-rw-num"><oj-bind-text value="[[ cell.row.number ]]"></oj-bind-text></span>
                <span class="oj-typography-body-sm oj-text-color-secondary"><oj-bind-text value="[[ cell.row.name || '—' ]]"></oj-bind-text></span></div>
            </template>
            <template slot="customerTpl" data-oj-as="cell">
              <span class="oj-typography-body-md"><oj-bind-text value="[[ cell.row.customer ]]"></oj-bind-text></span>
            </template>
            <template slot="typeTpl" data-oj-as="cell">
              <span class="oj-typography-body-md"><oj-bind-text value="[[ cell.row.type ]]"></oj-bind-text></span>
            </template>
            <template slot="statusTpl" data-oj-as="cell">
              <span :class="[[ cell.row.badge ]]" :title="[[ 'Stored status: ' + cell.row.stored ]]"><oj-bind-text value="[[ cell.row.status ]]"></oj-bind-text></span>
            </template>
            <template slot="validTpl" data-oj-as="cell">
              <div class="nx-rw-cell"><span class="oj-typography-body-md"><oj-bind-text value="[[ cell.row.dates ]]"></oj-bind-text></span>
                <oj-bind-if test="[[ !!cell.row.ends ]]"><span class="oj-badge oj-badge-warning oj-badge-subtle"><oj-bind-text value="[[ cell.row.ends ]]"></oj-bind-text></span></oj-bind-if></div>
            </template>
            <template slot="linesTpl" data-oj-as="cell">
              <span class="oj-typography-body-md"><oj-bind-text value="[[ cell.row.lines ]]"></oj-bind-text></span>
            </template>
            <template slot="nextTpl" data-oj-as="cell">
              <span class="oj-typography-body-sm"><oj-bind-text value="[[ cell.row.next ]]"></oj-bind-text></span>
            </template>
            <template slot="noData">
              <div class="oj-sm-padding-6x oj-typography-body-md oj-text-color-secondary"><oj-bind-text value="[[ $variables.unavailable ? $variables.unavailable
                : ($variables.isLoading ? 'Loading the agreements…' : ($variables.rows.length ? 'Nothing matches. Try another filter or clear the search.' : 'No rental agreements yet.')) ]]"></oj-bind-text></div>
            </template>
          </oj-table>
        </oj-sp-collection-container>
      </oj-sp-smart-search-page>
    </div>
  </oj-bind-if>

  <!-- ── Current ── -->
  <oj-bind-if test="[[ $application.variables.look !== 'redwood' ]]">
  <div class="nx-pagehead">
    <div>
      <div class="nx-kicker">Commercial</div>
      <h1>Agreements</h1>
      <div class="nx-sub" id="agrSummary"><oj-bind-text value="[[ $variables.unavailable ? 'Not available' : ($variables.isLoading && !$variables.rows.length ? 'Loading the agreements…' : $variables.summary) ]]"></oj-bind-text></div>
    </div>
    <oj-bind-if test="[[ !$variables.unavailable ]]">
      <div class="nx-actions">
        <button type="button" class="nx-btn nx-btn--plain" id="agrRefresh" on-click="[[ $listeners.onRefresh ]]" :disabled="[[ $variables.isLoading ]]">
          <span class="oj-ux-ico-refresh" aria-hidden="true"></span>Refresh</button>
        <div class="nx-export">
          <button type="button" class="nx-btn" id="agrExport" on-click="[[ $listeners.onExportMenu ]]" aria-haspopup="menu"
            :aria-expanded="[[ $variables.exportOpen ? 'true' : 'false' ]]">
            <span class="oj-ux-ico-download" aria-hidden="true"></span>Export<span class="oj-ux-ico-chevron-down" aria-hidden="true"></span></button>
          <oj-bind-if test="[[ $variables.exportOpen ]]">
            <div class="nx-menu" role="menu" aria-label="Export">
              <oj-bind-for-each data="[[ $functions.formats() ]]">
                <template data-oj-as="f">
                  <button type="button" role="menuitem" class="nx-menu-item" :data-format="[[ f.data.key ]]" on-click="[[ $listeners.onExport ]]">
                    <span :class="[[ f.data.icon ]]" aria-hidden="true"></span><oj-bind-text value="[[ f.data.label ]]"></oj-bind-text></button>
                </template>
              </oj-bind-for-each>
              <p class="nx-menu-note"><oj-bind-text value="[[ $variables.shown.length + ($variables.shown.length === 1 ? ' agreement' : ' agreements') + ', as shown' ]]"></oj-bind-text></p>
            </div>
          </oj-bind-if>
        </div>
        <oj-bind-if test="[[ $variables.canWrite ]]">
          <button type="button" class="nx-btn nx-btn--primary" id="agrNew" on-click="[[ $listeners.onNew ]]"><span class="oj-ux-ico-plus" aria-hidden="true"></span>New agreement</button>
        </oj-bind-if>
      </div>
    </oj-bind-if>
  </div>

  <oj-bind-if test="[[ !!$variables.unavailable ]]">
    <div class="nx-card nx-empty" role="status"><oj-bind-text value="[[ $variables.unavailable ]]"></oj-bind-text></div>
  </oj-bind-if>

  <oj-bind-if test="[[ !$variables.unavailable ]]">
    <div class="nx-toolbar">
      <label class="nx-search">
        <span class="oj-ux-ico-search" aria-hidden="true"></span>
        <input type="search" :value="[[ $variables.text ]]" on-input="[[ $listeners.onSearch ]]" aria-label="Search agreements"
          placeholder="Agreement, name, customer or type">
      </label>
    </div>
    <div class="nx-chips" role="group" aria-label="Which agreements">
      <oj-bind-for-each data="[[ $variables.chips ]]">
        <template data-oj-as="c">
          <button type="button" :data-value="[[ c.data.key ]]" on-click="[[ $listeners.onChip ]]"
            :aria-pressed="[[ $variables.chip === c.data.key ? 'true' : 'false' ]]"
            :class="[[ 'nx-chip' + (c.data.warn ? ' nx-cm-chip--warn' : '') + ($variables.chip === c.data.key ? ' nx-chip--on' : '') ]]">
            <oj-bind-text value="[[ c.data.label ]]"></oj-bind-text><span class="nx-chip-count"><oj-bind-text value="[[ c.data.count ]]"></oj-bind-text></span>
          </button>
        </template>
      </oj-bind-for-each>
    </div>

    <oj-bind-if test="[[ !!$variables.error ]]">
      <div class="nx-error" role="alert"><oj-bind-text value="[[ $variables.error ]]"></oj-bind-text></div>
    </oj-bind-if>
    <oj-bind-if test="[[ !$variables.isLoading && !$variables.error && !$variables.shown.length ]]">
      <div class="nx-card nx-empty"><oj-bind-text value="[[ $variables.rows.length ? 'Nothing matches. Try another chip or clear the search.' : 'No rental agreements yet.' ]]"></oj-bind-text></div>
    </oj-bind-if>

    <oj-bind-if test="[[ $variables.shown.length > 0 ]]">
      <section class="nx-card">
        <div class="nx-table">
          <div class="nx-grid nx-cm-agrid" role="table" aria-label="Agreements">
            <div class="nx-row nx-row--head" role="row">
              <span role="columnheader" :aria-sort="[[ $functions.ariaSort('number', $variables.sortKey, $variables.sortDir) ]]">
                <button type="button" class="nx-sort" data-key="number" on-click="[[ $listeners.onSort ]]">Agreement<oj-bind-text value="[[ $functions.sortMark('number', $variables.sortKey, $variables.sortDir) ]]"></oj-bind-text></button></span>
              <span role="columnheader" :aria-sort="[[ $functions.ariaSort('customer', $variables.sortKey, $variables.sortDir) ]]">
                <button type="button" class="nx-sort" data-key="customer" on-click="[[ $listeners.onSort ]]">Customer<oj-bind-text value="[[ $functions.sortMark('customer', $variables.sortKey, $variables.sortDir) ]]"></oj-bind-text></button></span>
              <span role="columnheader" :aria-sort="[[ $functions.ariaSort('status', $variables.sortKey, $variables.sortDir) ]]">
                <button type="button" class="nx-sort" data-key="status" on-click="[[ $listeners.onSort ]]">Status<oj-bind-text value="[[ $functions.sortMark('status', $variables.sortKey, $variables.sortDir) ]]"></oj-bind-text></button></span>
              <span role="columnheader" :aria-sort="[[ $functions.ariaSort('valid', $variables.sortKey, $variables.sortDir) ]]">
                <button type="button" class="nx-sort" data-key="valid" on-click="[[ $listeners.onSort ]]">Valid<oj-bind-text value="[[ $functions.sortMark('valid', $variables.sortKey, $variables.sortDir) ]]"></oj-bind-text></button></span>
              <span role="columnheader" :aria-sort="[[ $functions.ariaSort('lines', $variables.sortKey, $variables.sortDir) ]]">
                <button type="button" class="nx-sort" data-key="lines" on-click="[[ $listeners.onSort ]]">Lines<oj-bind-text value="[[ $functions.sortMark('lines', $variables.sortKey, $variables.sortDir) ]]"></oj-bind-text></button></span>
              <span role="columnheader">Next step</span>
            </div>
            <oj-bind-for-each data="[[ $variables.shown ]]">
              <template data-oj-as="r">
                <div role="row" class="nx-row nx-row--click" :data-number="[[ r.data.agreementNumber ]]" on-click="[[ $listeners.onOpen ]]">
                  <span role="cell">
                    <!-- The row opens the agreement (a click here reaches it); the button is for the keyboard. -->
                    <button type="button" class="nx-link nx-cm-num"><oj-bind-text value="[[ r.data.agreementNumber ]]"></oj-bind-text></button>
                    <span class="nx-cell-sub"><oj-bind-text value="[[ r.data.agreementName || '—' ]]"></oj-bind-text></span>
                  </span>
                  <span role="cell">
                    <span class="nx-cell-main"><oj-bind-text value="[[ r.data.customer || '—' ]]"></oj-bind-text></span>
                    <span class="nx-cell-sub"><oj-bind-text value="[[ r.data.agreementType ]]"></oj-bind-text></span>
                  </span>
                  <span role="cell"><span :class="[[ 'nx-pill ' + $functions.tone(r.data.statusCode) ]]" :title="[[ 'Stored status: ' + (r.data.statusCode || 'none') ]]">
                    <oj-bind-text value="[[ $functions.statusLabel(r.data.statusCode) ]]"></oj-bind-text></span></span>
                  <span role="cell">
                    <span class="nx-cell-main nx-num"><oj-bind-text value="[[ $functions.range(r.data.startDate, r.data.endDate) ]]"></oj-bind-text></span>
                    <oj-bind-if test="[[ !!$functions.expiryText(r.data) ]]">
                      <span class="nx-cell-sub nx-cm-warn"><span class="oj-ux-ico-warning" aria-hidden="true"></span><oj-bind-text value="[[ $functions.expiryText(r.data) ]]"></oj-bind-text></span>
                    </oj-bind-if>
                  </span>
                  <span role="cell" class="nx-num"><oj-bind-text value="[[ $functions.lines(r.data.lineCount) ]]"></oj-bind-text></span>
                  <span role="cell" class="nx-cell-next"><oj-bind-text value="[[ $functions.nextStep(r.data) ]]"></oj-bind-text></span>
                </div>
              </template>
            </oj-bind-for-each>
          </div>
        </div>
      </section>
    </oj-bind-if>
  </oj-bind-if>
  </oj-bind-if>
</div>

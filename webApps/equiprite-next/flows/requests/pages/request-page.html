<!-- One request in its own tab: where its equipment is (the journey), what is next and late, the equipment, the facts. -->
<div class="nx-page nx-record">
  <!-- Redwood (your menu, Look): Oracle's general overview page as the header, as Old's request detail: the request, where its
       equipment is (badge), the way back to Requests; its actions are the Current head's buttons, its next step the primary
       (rwActionChain). Over this tab's own body below. Put on the page the first time Redwood is shown, then kept. -->
  <oj-bind-if test="[[ $application.variables.lookSeen ]]">
    <div class="nx-rw nx-rw--head" id="recRedwood" :hidden="[[ $application.variables.look !== 'redwood' || !!$variables.error ]]">
      <oj-sp-general-overview-page display-mode="mixed" page-title="[[ $variables.head.requestNumber || $variables.number || 'Request' ]]"
        page-subtitle="[[ $functions.rwSub($variables.head, $variables.isLoading) ]]" badge="[[ $functions.rwBadge($variables.p) ]]"
        display-options.in-flow-back="true" on-sp-in-flow-back="[[ $listeners.onOpenList ]]"
        primary-action="[[ $functions.rwPrimary($variables.head, $variables.acts, $variables.stepBusy) ]]" on-sp-primary-action="[[ $listeners.onRwPrimary ]]"
        secondary-actions="[[ $functions.rwActions($variables.head, $variables.acts, $variables.stepBusy, $variables.isLoading, $application.variables.appUrls.new) ]]"
        on-sp-secondary-action="[[ $listeners.onRwAction ]]">
      </oj-sp-general-overview-page>
    </div>
  </oj-bind-if>

  <oj-bind-if test="[[ $variables.isLoading && !$variables.head.requestNumber ]]">
    <div class="nx-card nx-empty">Loading the request…</div>
  </oj-bind-if>
  <oj-bind-if test="[[ !!$variables.error ]]">
    <div class="nx-error" role="alert"><oj-bind-text value="[[ $variables.error ]]"></oj-bind-text>
      <button type="button" class="nx-link" on-click="[[ $listeners.onOpenList ]]">Open Requests</button></div>
  </oj-bind-if>

  <oj-bind-if test="[[ !!$variables.head.requestNumber && !$variables.error ]]">
    <oj-bind-if test="[[ $application.variables.look !== 'redwood' ]]">
    <div class="nx-pagehead">
      <div>
        <div class="nx-kicker"><oj-bind-text value="[[ $variables.head.external ? 'Customer request' : 'Project request' ]]"></oj-bind-text></div>
        <h1 class="nx-record-title">
          <oj-bind-text value="[[ $variables.head.requestNumber ]]"></oj-bind-text>
          <span :class="[[ 'nx-pill nx-record-pill nx-stage--' + $variables.p.tone ]]" :title="[[ 'Stored request status: ' + $variables.head.status ]]">
            <oj-bind-text value="[[ $variables.p.headline ]]"></oj-bind-text></span>
        </h1>
        <div class="nx-sub"><oj-bind-text value="[[ $functions.subline($variables.head) ]]"></oj-bind-text></div>
      </div>
      <div class="nx-actions">
        <button type="button" class="nx-btn nx-btn--plain" on-click="[[ $listeners.onRefresh ]]" :disabled="[[ $variables.isLoading ]]">
          <span class="oj-ux-ico-refresh" aria-hidden="true"></span>Refresh</button>
        <div class="nx-export">
          <button type="button" class="nx-btn" id="recExport" on-click="[[ $listeners.onExportMenu ]]" aria-haspopup="menu"
            :aria-expanded="[[ $variables.exportOpen ? 'true' : 'false' ]]"><span class="oj-ux-ico-download" aria-hidden="true"></span>Export
            <span class="oj-ux-ico-chevron-down" aria-hidden="true"></span></button>
          <oj-bind-if test="[[ $variables.exportOpen ]]">
            <div class="nx-menu" role="menu" aria-label="Export the equipment">
              <oj-bind-for-each data="[[ $functions.formats() ]]">
                <template data-oj-as="f">
                  <button type="button" role="menuitem" class="nx-menu-item" :data-format="[[ f.data.key ]]" on-click="[[ $listeners.onExport ]]">
                    <span :class="[[ f.data.icon ]]" aria-hidden="true"></span><oj-bind-text value="[[ f.data.label ]]"></oj-bind-text></button>
                </template>
              </oj-bind-for-each>
            </div>
          </oj-bind-if>
        </div>
        <oj-bind-if test="[[ $variables.head.status === 'DRAFT' && !$variables.head.external ]]">
          <button type="button" class="nx-btn nx-btn--primary" id="recFinishDraft" on-click="[[ $listeners.onFinishDraft ]]">
            <span class="oj-ux-ico-edit-box" aria-hidden="true"></span>Finish this draft</button>
        </oj-bind-if>
        <oj-bind-if test="[[ $variables.acts.approve ]]">
          <button type="button" class="nx-btn nx-btn--primary" id="recApprove" data-act="approve" on-click="[[ $listeners.onStep ]]"
            title="Approve or send back in Approve &amp; allocate, opened on this request"><span class="oj-ux-ico-check-circle" aria-hidden="true"></span>Approve…</button>
        </oj-bind-if>
        <oj-bind-if test="[[ $variables.acts.assign ]]">
          <button type="button" class="nx-btn nx-btn--primary" id="recAssign" data-act="assign" on-click="[[ $listeners.onStep ]]">
            <span class="oj-ux-ico-assign-to-me" aria-hidden="true"></span>Assign units</button>
        </oj-bind-if>
        <!-- Unit assigned, not confirmed: Confirm for picking asks Fusion for the transfer order (confirmPicking); then the yard picks it. -->
        <oj-bind-if test="[[ $variables.acts.confirm > 0 ]]">
          <button type="button" class="nx-btn nx-btn--primary" id="recConfirm" data-act="ask" data-value="confirm" on-click="[[ $listeners.onStep ]]"
            :disabled="[[ !$variables.acts.mayConfirm || !!$variables.stepBusy ]]"
            :title="[[ $variables.acts.mayConfirm ? 'Ask Fusion for the transfer order and schedule the pieces for picking' : 'The Equipment Manager confirms: it needs full access to Approve & allocate' ]]">
            <span class="oj-ux-ico-check-square" aria-hidden="true"></span><oj-bind-text value="[[ 'Confirm ' + $variables.acts.confirm + ' for picking' ]]"></oj-bind-text></button>
        </oj-bind-if>
        <oj-bind-if test="[[ $variables.acts.pick > 0 ]]">
          <button type="button" class="nx-btn nx-btn--primary" id="recPick" data-act="pick" on-click="[[ $listeners.onStep ]]"
            title="In the yard's queue: Picking & shipping opens on this request, highlighted">
            <span class="oj-ux-ico-fullfilment-box" aria-hidden="true"></span><oj-bind-text value="[[ 'Pick ' + $variables.acts.pick + ' at the yard' ]]"></oj-bind-text></button>
        </oj-bind-if>
        <!-- On its way to site: the site accepts the delivery here (acceptDelivery). -->
        <oj-bind-if test="[[ $variables.acts.accept > 0 ]]">
          <button type="button" class="nx-btn nx-btn--primary nx-btn--ok" id="recAccept" data-act="ask" data-value="accept" on-click="[[ $listeners.onStep ]]"
            :disabled="[[ !$variables.acts.mayAccept || !!$variables.stepBusy ]]"
            :title="[[ $variables.acts.mayAccept ? 'The pieces have arrived: accept them on site' : 'The site accepts it: that needs full access to Requests' ]]">
            <span class="oj-ux-ico-check-circle" aria-hidden="true"></span><oj-bind-text value="[[ 'Accept ' + $variables.acts.accept + ' on site' ]]"></oj-bind-text></button>
        </oj-bind-if>
        <oj-bind-if test="[[ $variables.head.status !== 'DRAFT' && !!$functions.newUrl($application.variables.appUrls.new, $variables.head) ]]">
          <a class="nx-btn" id="recInNew" :href="[[ $functions.newUrl($application.variables.appUrls.new, $variables.head) ]]"
            title="Allocate units or start a return there, until Next has those steps">
            <span class="oj-ux-ico-external-link" aria-hidden="true"></span>Act on it in New</a>
        </oj-bind-if>
      </div>
    </div>
    </oj-bind-if>

    <!-- Confirm or Accept: what it will do, asked once before it is done; then what happened. -->
    <oj-bind-if test="[[ !!$variables.ask ]]">
      <div :class="[[ 'nx-rec-ask nx-road--' + ($variables.ask === 'confirm' ? 'confirm' : 'shipped') ]]" id="recAsk" role="group" aria-label="Before it is done">
        <span :class="[[ $variables.ask === 'confirm' ? 'oj-ux-ico-check-square' : 'oj-ux-ico-check-circle' ]]" aria-hidden="true"></span>
        <p><oj-bind-text value="[[ $functions.askText($variables.ask, $variables.acts) ]]"></oj-bind-text></p>
        <span class="nx-rec-ask-acts">
          <button type="button" class="nx-btn nx-btn--sm nx-btn--primary nx-road-go" id="recAskYes" data-act="do" :data-value="[[ $variables.ask ]]" on-click="[[ $listeners.onStep ]]"
            :disabled="[[ !!$variables.stepBusy ]]">
            <oj-bind-if test="[[ !!$variables.stepBusy ]]"><span class="nx-spin" aria-hidden="true"></span></oj-bind-if>
            <oj-bind-text value="[[ $functions.askGo($variables.ask, $variables.acts, $variables.stepBusy) ]]"></oj-bind-text></button>
          <button type="button" class="nx-btn nx-btn--sm" id="recAskNo" data-act="ask" data-value="" on-click="[[ $listeners.onStep ]]" :disabled="[[ !!$variables.stepBusy ]]">Cancel</button>
        </span>
      </div>
    </oj-bind-if>
    <oj-bind-if test="[[ !!$variables.stepResult.text ]]">
      <div :class="[[ 'nx-pop-result nx-pop-result--' + $variables.stepResult.tone ]]" id="recResult" role="status">
        <strong><oj-bind-text value="[[ $variables.stepResult.title ]]"></oj-bind-text></strong>
        <oj-bind-text value="[[ ' ' + $variables.stepResult.text ]]"></oj-bind-text></div>
    </oj-bind-if>

    <section class="nx-card nx-card-pad nx-journey" aria-labelledby="recJourney">
      <div class="nx-journey-head">
        <h2 class="nx-h2" id="recJourney">Where the equipment is</h2>
        <oj-bind-if test="[[ !!$variables.p.detail ]]"><span class="nx-note"><oj-bind-text value="[[ $variables.p.detail ]]"></oj-bind-text></span></oj-bind-if>
      </div>
      <ol class="nx-track" aria-label="The journey">
        <oj-bind-for-each data="[[ $variables.p.stops ]]">
          <template data-oj-as="stop">
            <li :class="[[ 'nx-stop nx-stop--' + stop.data.state + ' nx-stage--' + stop.data.key ]]" :data-stop="[[ stop.data.key ]]"
              :aria-current="[[ stop.data.state === 'here' ? 'step' : 'false' ]]">
              <span class="nx-stop-bar" aria-hidden="true"></span>
              <span class="nx-stop-label"><oj-bind-text value="[[ stop.data.label ]]"></oj-bind-text></span>
              <span class="nx-stop-note"><oj-bind-text value="[[ $functions.stopNote(stop.data, $variables.p.total) ]]"></oj-bind-text></span>
            </li>
          </template>
        </oj-bind-for-each>
      </ol>
      <div class="nx-journey-foot">
        <oj-bind-if test="[[ !!$variables.p.next ]]">
          <span class="nx-next"><strong>Next:</strong> <oj-bind-text value="[[ $variables.p.next ? $variables.p.next.text : '' ]]"></oj-bind-text></span>
        </oj-bind-if>
        <oj-bind-for-each data="[[ $variables.p.late ]]">
          <template data-oj-as="lt"><span class="nx-late"><span class="oj-ux-ico-warning" aria-hidden="true"></span><oj-bind-text value="[[ lt.data.text ]]"></oj-bind-text></span></template>
        </oj-bind-for-each>
      </div>
    </section>

    <div class="nx-record-body">
      <section class="nx-card" aria-labelledby="recLines">
        <div class="nx-card-head"><h2 id="recLines"><oj-bind-text value="[[ 'Equipment (' + $variables.lines.length + ')' ]]"></oj-bind-text></h2></div>
        <!-- Redwood: the same lines as Oracle's table (oj-table, oj-badge), hidden under Current. Put on the page once the
             request and its history are read: a tab just opened settles first (an oj-table started while its new tab is
             still being put in front fetches twice, and the first fetch's abort reaches the browser as an error). -->
        <oj-bind-if test="[[ $application.variables.lookSeen && !$variables.isLoading && !$variables.history.loading ]]">
          <div class="nx-rec-rwlines" :hidden="[[ $application.variables.look !== 'redwood' ]]">
            <oj-table id="recRwLines" data="[[ $variables.rwLinesADP ]]" class="oj-sm-width-full nx-rw-table" aria-labelledby="recLines"
              display="list" horizontal-grid-visible="enabled" layout="fixed" scroll-policy="loadMoreOnScroll" scroll-policy-options.fetch-size="100"
              columns='[
                {"headerText": "Equipment", "field": "name", "template": "eqTpl", "sortable": "disabled", "style": "width:24%;"},
                {"headerText": "Qty", "field": "qty", "template": "qtyTpl", "sortable": "disabled", "style": "width:7%;", "headerClassName": "oj-helper-text-align-end"},
                {"headerText": "Unit", "field": "unit", "template": "unitTpl", "sortable": "disabled", "style": "width:15%;"},
                {"headerText": "Where it is", "field": "lineStatus", "template": "whereTpl", "sortable": "disabled", "style": "width:24%;"},
                {"headerText": "Dates", "field": "start", "template": "datesTpl", "sortable": "disabled", "style": "width:16%;"},
                {"headerText": "Rate", "field": "billRate", "template": "rateTpl", "sortable": "disabled", "style": "width:14%;", "headerClassName": "oj-helper-text-align-end"}
              ]'>
              <template slot="eqTpl" data-oj-as="cell">
                <div class="nx-rw-cell"><span class="oj-typography-body-md oj-typography-semi-bold"><oj-bind-text value="[[ cell.row.name ]]"></oj-bind-text></span>
                  <span class="oj-typography-body-sm oj-text-color-secondary"><oj-bind-text value="[[ cell.row.cls + (cell.row.agreementNumber ? ' · agreement ' + cell.row.agreementNumber : '') ]]"></oj-bind-text></span></div>
              </template>
              <template slot="qtyTpl" data-oj-as="cell">
                <div class="nx-rec-rwnum"><oj-bind-text value="[[ cell.row.qty ]]"></oj-bind-text></div>
              </template>
              <template slot="unitTpl" data-oj-as="cell">
                <span class="oj-typography-body-sm"><oj-bind-text value="[[ cell.row.unit ]]"></oj-bind-text></span>
              </template>
              <template slot="whereTpl" data-oj-as="cell">
                <span :class="[[ $functions.rwLineBadge(cell.row.lineStatus, $variables.head.external) ]]" :title="[[ 'Stored line status: ' + cell.row.lineStatus ]]">
                  <oj-bind-text value="[[ $functions.lineLabel(cell.row.lineStatus, $variables.head.external) ]]"></oj-bind-text></span>
              </template>
              <template slot="datesTpl" data-oj-as="cell">
                <span class="oj-typography-body-sm"><oj-bind-text value="[[ $functions.range(cell.row.start || $variables.head.start, cell.row.end || $variables.head.end) ]]"></oj-bind-text></span>
              </template>
              <template slot="rateTpl" data-oj-as="cell">
                <div class="nx-rec-rwnum"><oj-bind-text value="[[ $functions.rate(cell.row) ]]"></oj-bind-text></div>
              </template>
              <template slot="noData">
                <div class="oj-sm-padding-6x oj-typography-body-md oj-text-color-secondary">No equipment on this request.</div>
              </template>
            </oj-table>
          </div>
        </oj-bind-if>
        <oj-bind-if test="[[ $application.variables.look !== 'redwood' ]]">
        <div class="nx-table">
          <div class="nx-grid nx-grid--lines" role="table" aria-labelledby="recLines">
            <div class="nx-row nx-row--head" role="row">
              <span role="columnheader">Equipment</span><span role="columnheader">Qty</span><span role="columnheader">Unit</span>
              <span role="columnheader">Where it is</span><span role="columnheader">Dates</span><span role="columnheader">Rate</span>
            </div>
            <oj-bind-for-each data="[[ $variables.lines ]]">
              <template data-oj-as="l">
                <div class="nx-row" role="row" :data-line="[[ l.data.lineNumber ]]">
                  <span role="cell"><span class="nx-cell-main"><oj-bind-text value="[[ l.data.name ]]"></oj-bind-text></span>
                    <span class="nx-cell-sub"><oj-bind-text value="[[ l.data.cls + (l.data.agreementNumber ? ' · agreement ' + l.data.agreementNumber : '') ]]"></oj-bind-text></span></span>
                  <span role="cell" class="nx-num"><oj-bind-text value="[[ l.data.qty ]]"></oj-bind-text></span>
                  <span role="cell" class="nx-ellipsis"><oj-bind-text value="[[ l.data.unit ]]"></oj-bind-text></span>
                  <span role="cell"><span :class="[[ 'nx-pill nx-stage--' + $functions.lineStage(l.data.lineStatus, $variables.head.external) ]]" :title="[[ 'Stored line status: ' + l.data.lineStatus ]]">
                    <oj-bind-text value="[[ $functions.lineLabel(l.data.lineStatus, $variables.head.external) ]]"></oj-bind-text></span></span>
                  <span role="cell" class="nx-num"><oj-bind-text value="[[ $functions.range(l.data.start || $variables.head.start, l.data.end || $variables.head.end) ]]"></oj-bind-text></span>
                  <span role="cell" class="nx-num"><oj-bind-text value="[[ l.data.billRate != null && l.data.billRate !== '' ? $functions.money(l.data.billRate) + (l.data.priceUom ? ' / ' + l.data.priceUom : '') : '—' ]]"></oj-bind-text></span>
                </div>
              </template>
            </oj-bind-for-each>
          </div>
        </div>
        </oj-bind-if>
      </section>

      <aside class="nx-card nx-card-pad nx-facts" aria-label="About this request">
        <dl>
          <div><dt>Requested by</dt><dd><oj-bind-text value="[[ $variables.head.requestor || '—' ]]"></oj-bind-text></dd></div>
          <div><dt>Dates</dt><dd><oj-bind-text value="[[ $functions.range($variables.head.start, $variables.head.end) || '—' ]]"></oj-bind-text></dd></div>
          <div><dt>Deliver to</dt><dd><oj-bind-text value="[[ $variables.head.location || '—' ]]"></oj-bind-text></dd></div>
          <oj-bind-if test="[[ !!$variables.head.project ]]"><div><dt>Project</dt><dd><oj-bind-text value="[[ $variables.head.project ]]"></oj-bind-text></dd></div></oj-bind-if>
          <oj-bind-if test="[[ !!$variables.head.customer ]]"><div><dt>Customer</dt><dd><oj-bind-text value="[[ $variables.head.customer ]]"></oj-bind-text></dd></div></oj-bind-if>
          <oj-bind-if test="[[ !!$variables.head.contract ]]"><div><dt>Contract</dt><dd><oj-bind-text value="[[ $variables.head.contract ]]"></oj-bind-text></dd></div></oj-bind-if>
          <oj-bind-if test="[[ $variables.head.estCost != null ]]"><div><dt>Estimated cost</dt><dd class="nx-num"><oj-bind-text value="[[ $functions.money($variables.head.estCost) ]]"></oj-bind-text></dd></div></oj-bind-if>
          <div><dt>Stored status</dt><dd class="nx-muted"><oj-bind-text value="[[ $variables.head.status || '—' ]]"></oj-bind-text></dd></div>
        </dl>
      </aside>
    </div>

    <!-- History: from start to end (requestHistory). Steps on the left, everything that happened on the right. -->
    <section class="nx-card nx-card-pad nx-record-history" aria-labelledby="recHistory">
      <div class="nx-journey-head">
        <h2 class="nx-h2" id="recHistory"><span class="oj-ux-ico-clock-history" aria-hidden="true"></span> History</h2>
        <div class="nx-actions">
          <button type="button" class="nx-link" data-act="help" on-click="[[ $listeners.onStep ]]">How a request moves</button>
          <oj-bind-for-each data="[[ $functions.formats() ]]">
            <template data-oj-as="f">
              <button type="button" class="nx-btn nx-btn--sm" data-act="export" :data-value="[[ f.data.key ]]" on-click="[[ $listeners.onStep ]]"
                :disabled="[[ $variables.history.loading || !!$variables.history.error ]]" :title="[[ 'Export the history: ' + f.data.label ]]">
                <span :class="[[ f.data.icon ]]" aria-hidden="true"></span><oj-bind-text value="[[ f.data.label ]]"></oj-bind-text></button>
            </template>
          </oj-bind-for-each>
        </div>
      </div>
      <oj-bind-if test="[[ $variables.history.loading ]]">
        <div class="nx-pop-busy" role="status"><span class="nx-spin" aria-hidden="true"></span>Reading its history…</div>
      </oj-bind-if>
      <oj-bind-if test="[[ !!$variables.history.error ]]">
        <div class="nx-error" role="alert"><oj-bind-text value="[[ $variables.history.error ]]"></oj-bind-text></div>
      </oj-bind-if>
      <oj-bind-if test="[[ !$variables.history.loading && !$variables.history.error ]]">
        <div class="nx-seg nx-hist-tabs" role="group" aria-label="Show">
          <button type="button" data-act="tab" data-value="steps" on-click="[[ $listeners.onStep ]]" :aria-pressed="[[ $variables.histTab !== 'activity' ? 'true' : 'false' ]]"
            :class="[[ 'nx-seg-btn' + ($variables.histTab !== 'activity' ? ' nx-seg-btn--on' : '') ]]">Steps</button>
          <button type="button" data-act="tab" data-value="activity" on-click="[[ $listeners.onStep ]]" :aria-pressed="[[ $variables.histTab === 'activity' ? 'true' : 'false' ]]"
            :class="[[ 'nx-seg-btn' + ($variables.histTab === 'activity' ? ' nx-seg-btn--on' : '') ]]">Everything that happened</button>
        </div>
        <div :class="[[ 'nx-hist-cols nx-hist-cols--' + $variables.histTab ]]">
          <div class="nx-hist-col nx-hist-col--steps">
            <h3 class="nx-h3">Steps</h3>
            <ol class="nx-hist" aria-label="Steps">
              <oj-bind-for-each data="[[ $functions.arr($variables.history.milestones) ]]">
                <template data-oj-as="m">
                  <li :class="[[ 'nx-hist-step nx-hist-step--' + m.data.state + ' nx-stage--' + m.data.stage ]]" :data-step="[[ m.data.key ]]">
                    <span class="nx-hist-dot" aria-hidden="true"></span>
                    <span class="nx-hist-body">
                      <span class="nx-hist-label"><oj-bind-text value="[[ m.data.label ]]"></oj-bind-text>
                        <oj-bind-if test="[[ !!m.data.count ]]"><span class="nx-hist-count"><oj-bind-text value="[[ m.data.count ]]"></oj-bind-text></span></oj-bind-if>
                        <span class="nx-hist-state"><oj-bind-text value="[[ $functions.stepState(m.data) ]]"></oj-bind-text></span></span>
                      <span class="nx-hist-when"><oj-bind-text value="[[ $functions.stepWhen(m.data) ]]"></oj-bind-text></span>
                      <oj-bind-if test="[[ !!m.data.note ]]"><span class="nx-hist-note"><oj-bind-text value="[[ m.data.note ]]"></oj-bind-text></span></oj-bind-if>
                    </span>
                  </li>
                </template>
              </oj-bind-for-each>
            </ol>
          </div>
          <div class="nx-hist-col nx-hist-col--activity">
            <h3 class="nx-h3"><oj-bind-text value="[[ 'Everything that happened (' + $functions.arr($variables.history.events).length + ')' ]]"></oj-bind-text></h3>
            <oj-bind-if test="[[ !$functions.arr($variables.history.events).length ]]"><p class="nx-note">Nothing has been recorded on this request yet.</p></oj-bind-if>
            <ul class="nx-act" aria-label="Everything that happened, newest first">
              <oj-bind-for-each data="[[ $functions.arr($variables.history.events) ]]">
                <template data-oj-as="e">
                  <li :class="[[ 'nx-act-item nx-stage--' + (e.data.stage || 'ready') + (e.data.kind === 'stopped' ? ' nx-act-item--stopped' : '') ]]">
                    <span class="nx-act-dot" aria-hidden="true"></span>
                    <span class="nx-act-body">
                      <span class="nx-act-title"><oj-bind-text value="[[ e.data.title ]]"></oj-bind-text></span>
                      <oj-bind-if test="[[ !!e.data.text ]]"><span class="nx-act-text"><oj-bind-text value="[[ e.data.text ]]"></oj-bind-text></span></oj-bind-if>
                      <span class="nx-act-meta"><oj-bind-text value="[[ $functions.eventMeta(e.data) ]]"></oj-bind-text></span>
                    </span>
                  </li>
                </template>
              </oj-bind-for-each>
            </ul>
          </div>
        </div>
        <p class="nx-note nx-hist-source"><oj-bind-text value="[[ $variables.history.note ]]"></oj-bind-text></p>
      </oj-bind-if>
    </section>

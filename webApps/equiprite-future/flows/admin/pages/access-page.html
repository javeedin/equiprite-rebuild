<!-- Access. Every role against every page, with what each level means; a cell is a choice of Full, Read only or Hidden.
     Before Save, the bar says what each changed role gains and loses in the menu. Saved as New EquipRite saves Page
     access, one PUT per changed role. Logic: resources/js/accessMatrix.js. -->
<div class="nx-page nx-ac">
  <div class="nx-pagehead">
    <div>
      <div class="nx-kicker">Admin</div>
      <h1>Access</h1>
      <div class="nx-sub">Which screens each role can open, in Old, New and Next EquipRite. A change reaches people the next time they sign in.</div>
    </div>
    <div class="nx-actions">
      <div class="nx-export">
        <button type="button" class="nx-btn" id="acExport" on-click="[[ $listeners.onExportMenu ]]" aria-haspopup="menu" :disabled="[[ !$variables.rows.length ]]"
          :aria-expanded="[[ $variables.exportOpen ? 'true' : 'false' ]]">
          <span class="oj-ux-ico-download" aria-hidden="true"></span>Export<span class="oj-ux-ico-chevron-down" aria-hidden="true"></span></button>
        <oj-bind-if test="[[ $variables.exportOpen ]]">
          <div class="nx-menu" role="menu" aria-label="Export">
            <oj-bind-for-each data="[[ $functions.formats() ]]">
              <template data-oj-as="fm">
                <button type="button" role="menuitem" class="nx-menu-item" :data-format="[[ fm.data.key ]]" on-click="[[ $listeners.onExport ]]">
                  <span :class="[[ fm.data.icon ]]" aria-hidden="true"></span><oj-bind-text value="[[ fm.data.label ]]"></oj-bind-text></button>
              </template>
            </oj-bind-for-each>
            <p class="nx-menu-note"><oj-bind-text value="[[ $variables.shown.length + ' pages × ' + $variables.roles.length + ' roles, as shown' ]]"></oj-bind-text></p>
          </div>
        </oj-bind-if>
      </div>
      <oj-bind-if test="[[ $variables.dirtyCount > 0 ]]">
        <button type="button" class="nx-btn" id="acDiscard" on-click="[[ $listeners.onDiscard ]]" :disabled="[[ $variables.isSaving ]]">Discard</button>
      </oj-bind-if>
      <button type="button" class="nx-btn nx-btn--primary" id="acSave" on-click="[[ $listeners.onSave ]]"
        :disabled="[[ !$variables.canEdit || $variables.dirtyCount === 0 || $variables.isSaving ]]">
        <oj-bind-text value="[[ $functions.saveLabel($variables.dirtyCount, $variables.isSaving) ]]"></oj-bind-text></button>
    </div>
  </div>

  <oj-bind-if test="[[ !!$variables.loadError ]]">
    <div class="nx-error" role="alert" id="acLoadError"><oj-bind-text value="[[ $variables.loadError ]]"></oj-bind-text></div>
  </oj-bind-if>

  <!-- What the levels mean. -->
  <ul class="nx-ac-legend" aria-label="What each level means">
    <oj-bind-for-each data="[[ $functions.levels() ]]">
      <template data-oj-as="lv">
        <li><span :class="[[ 'nx-ac-dot nx-ac-lvl--' + lv.data.value ]]" aria-hidden="true"></span><strong><oj-bind-text value="[[ lv.data.label ]]"></oj-bind-text></strong>
          <span class="nx-muted"><oj-bind-text value="[[ lv.data.hint ]]"></oj-bind-text></span></li>
      </template>
    </oj-bind-for-each>
    <li><span class="oj-ux-ico-lock nx-ac-lockicon" aria-hidden="true"></span><strong>Locked</strong><span class="nx-muted">Set by EquipRite; not changed here</span></li>
  </ul>

  <!-- The consequence, before Save. -->
  <oj-bind-if test="[[ $variables.dirtyCount > 0 ]]">
    <section class="nx-ac-pending" id="acPending" role="status" aria-label="Unsaved changes">
      <div class="nx-ac-pending-head">
        <strong><oj-bind-text value="[[ $functions.pendingText($variables.dirtyCount, $variables.cons.length) ]]"></oj-bind-text></strong>
        <span class="nx-actions">
          <button type="button" class="nx-btn nx-btn--sm" on-click="[[ $listeners.onDiscard ]]" :disabled="[[ $variables.isSaving ]]">Discard</button>
          <button type="button" class="nx-btn nx-btn--sm nx-btn--primary" on-click="[[ $listeners.onSave ]]" :disabled="[[ $variables.isSaving ]]">
            <oj-bind-text value="[[ $functions.saveLabel($variables.dirtyCount, $variables.isSaving) ]]"></oj-bind-text></button>
        </span>
      </div>
      <ul class="nx-ac-cons">
        <oj-bind-for-each data="[[ $variables.cons ]]">
          <template data-oj-as="c">
            <li :data-role="[[ c.data.roleId ]]">
              <span class="nx-ac-cons-role"><oj-bind-text value="[[ c.data.roleName ]]"></oj-bind-text></span>
              <span class="nx-ac-cons-changes"><oj-bind-text value="[[ c.data.changeText ]]"></oj-bind-text></span>
              <span class="nx-ac-cons-menu"><oj-bind-text value="[[ c.data.text ]]"></oj-bind-text></span>
              <oj-bind-for-each data="[[ c.data.warnings ]]">
                <template data-oj-as="w"><span class="nx-ac-warn"><span class="oj-ux-ico-warning" aria-hidden="true"></span><oj-bind-text value="[[ w.data ]]"></oj-bind-text></span></template>
              </oj-bind-for-each>
            </li>
          </template>
        </oj-bind-for-each>
      </ul>
    </section>
  </oj-bind-if>

  <oj-bind-for-each data="[[ $functions.errorList($variables.saveErrors) ]]">
    <template data-oj-as="er"><div class="nx-error" role="alert"><oj-bind-text value="[[ er.data ]]"></oj-bind-text></div></template>
  </oj-bind-for-each>

  <oj-bind-if test="[[ $variables.isLoading ]]">
    <div class="nx-card nx-empty" role="status">Loading the roles and their pages…</div>
  </oj-bind-if>

  <oj-bind-if test="[[ !$variables.isLoading && $variables.rows.length > 0 ]]">
    <section class="nx-card" aria-labelledby="acMatrixTitle">
      <div class="nx-card-head nx-ac-head">
        <div>
          <h2 id="acMatrixTitle">Pages by role</h2>
          <span class="nx-note"><oj-bind-text value="[[ $variables.rows.length + ' pages · ' + $variables.roles.length + ' roles' ]]"></oj-bind-text></span>
        </div>
        <div class="nx-toolbar">
          <div class="nx-chips" role="group" aria-label="Show">
            <button type="button" data-field="only" data-value="all" on-click="[[ $listeners.onPick ]]" :aria-pressed="[[ $functions.pressed($variables.only === 'all') ]]"
              :class="[[ 'nx-chip' + ($variables.only === 'all' ? ' nx-chip--on' : '') ]]">Every page<span class="nx-chip-count"><oj-bind-text value="[[ $variables.rows.length ]]"></oj-bind-text></span></button>
            <button type="button" data-field="only" data-value="changed" on-click="[[ $listeners.onPick ]]" :aria-pressed="[[ $functions.pressed($variables.only === 'changed') ]]"
              :class="[[ 'nx-chip' + ($variables.only === 'changed' ? ' nx-chip--on' : '') ]]">Changed<span class="nx-chip-count"><oj-bind-text value="[[ $functions.countChanged($variables.rows) ]]"></oj-bind-text></span></button>
            <button type="button" data-field="only" data-value="locked" on-click="[[ $listeners.onPick ]]" :aria-pressed="[[ $functions.pressed($variables.only === 'locked') ]]"
              :class="[[ 'nx-chip' + ($variables.only === 'locked' ? ' nx-chip--on' : '') ]]">Locked<span class="nx-chip-count"><oj-bind-text value="[[ $functions.countLocked($variables.rows) ]]"></oj-bind-text></span></button>
          </div>
          <label class="nx-search nx-ac-search">
            <span class="oj-ux-ico-search" aria-hidden="true"></span>
            <input type="search" :value="[[ $variables.text ]]" on-input="[[ $listeners.onSearch ]]" aria-label="Find a page" placeholder="Find a page or a screen">
          </label>
        </div>
      </div>
      <oj-bind-if test="[[ !$variables.shown.length ]]"><div class="nx-empty">No page matches. Clear the search or pick Every page.</div></oj-bind-if>
      <oj-bind-if test="[[ $variables.shown.length > 0 ]]">
        <div class="nx-table nx-ac-table">
          <div class="nx-grid nx-ac-grid" role="table" aria-label="Pages by role" :style="[[ $functions.gridStyle($variables.roles.length) ]]">
            <div class="nx-row nx-row--head nx-ac-row" role="row" :style="[[ $functions.rowStyle($variables.roles.length) ]]">
              <span role="columnheader">Page</span>
              <oj-bind-for-each data="[[ $variables.roles ]]">
                <template data-oj-as="ro">
                  <span role="columnheader" class="nx-ac-rolehead" :title="[[ ro.data.roleCode || '' ]]"><oj-bind-text value="[[ ro.data.roleName || ro.data.roleCode ]]"></oj-bind-text>
                    <span class="nx-ac-rolecode"><oj-bind-text value="[[ $functions.roleSub(ro.data) ]]"></oj-bind-text></span></span>
                </template>
              </oj-bind-for-each>
            </div>
            <oj-bind-for-each data="[[ $variables.shown ]]">
              <template data-oj-as="r">
                <oj-bind-if test="[[ r.data.first ]]">
                  <div class="nx-ac-module" role="row"><span role="rowheader"><oj-bind-text value="[[ r.data.module ]]"></oj-bind-text></span></div>
                </oj-bind-if>
                <div :class="[[ 'nx-row nx-ac-row' + ($functions.countChanged([r.data]) ? ' nx-ac-row--dirty' : '') ]]" role="row" :data-page="[[ r.data.pageCode ]]"
                  :style="[[ $functions.rowStyle($variables.roles.length) ]]">
                  <span role="rowheader" class="nx-ac-page">
                    <span class="nx-cell-main"><oj-bind-text value="[[ r.data.pageLabel ]]"></oj-bind-text></span>
                    <span class="nx-cell-sub"><oj-bind-text value="[[ r.data.pageCode ]]"></oj-bind-text></span>
                    <span class="nx-cell-sub nx-ac-opens"><oj-bind-text value="[[ r.data.opens ]]"></oj-bind-text></span>
                  </span>
                  <oj-bind-for-each data="[[ r.data.cells ]]">
                    <template data-oj-as="c">
                      <span role="cell" :class="[[ $functions.cellClass(c.data) ]]" :data-role="[[ c.data.roleId ]]" :title="[[ c.data.title ]]">
                        <oj-bind-if test="[[ c.data.missing ]]"><span class="nx-muted" aria-label="Not in this role's pages">—</span></oj-bind-if>
                        <oj-bind-if test="[[ c.data.locked ]]">
                          <span class="nx-ac-locked"><span class="oj-ux-ico-lock" aria-hidden="true"></span><oj-bind-text value="[[ $functions.levelLabel(c.data.level) ]]"></oj-bind-text></span>
                        </oj-bind-if>
                        <oj-bind-if test="[[ !c.data.missing && !c.data.locked ]]">
                          <!-- The level is marked on its option (a select's value is a property, which a binding does not set). -->
                          <select class="nx-ac-select" :data-role="[[ c.data.roleId ]]" :data-page="[[ c.data.pageCode ]]" :data-level="[[ c.data.level ]]"
                            on-change="[[ $listeners.onLevel ]]" :disabled="[[ !$variables.canEdit || $variables.isSaving ]]" :aria-label="[[ c.data.title ]]">
                            <option value="FULL" :selected="[[ c.data.level === 'FULL' ]]">Full</option>
                            <option value="READ_ONLY" :selected="[[ c.data.level === 'READ_ONLY' ]]">Read only</option>
                            <option value="HIDDEN" :selected="[[ c.data.level === 'HIDDEN' ]]">Hidden</option>
                          </select>
                          <oj-bind-if test="[[ c.data.dirty ]]"><span class="nx-ac-was"><oj-bind-text value="[[ c.data.was ]]"></oj-bind-text></span></oj-bind-if>
                        </oj-bind-if>
                      </span>
                    </template>
                  </oj-bind-for-each>
                </div>
              </template>
            </oj-bind-for-each>
          </div>
        </div>
      </oj-bind-if>
    </section>
  </oj-bind-if>
</div>

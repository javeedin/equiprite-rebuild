<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'">
  <title>EquipRite Web Services</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f6; --surface: #ffffff; --ink: #16222a; --muted: #5a6871; --line: #d6dde1; --soft: #e8eef1;
      --accent: #2e5468; --accent-ink: #ffffff; --band: #2e5468; --band-ink: #eef4f7; --band-muted: #b8cbd5;
      --get: #1d6a99; --post: #367646; --put: #8c6210; --patch: #7d4f96; --delete: #ad3427; --m-ink: #ffffff;
      --param: #9a4f12; --warn-bg: #fff4dc; --warn-ink: #7a5300; --ok-bg: #e3f3e7; --ok-ink: #1f5c2e; --bad-bg: #fbe4e1; --bad-ink: #8e2a1f;
      --body: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #11181d; --surface: #182229; --ink: #e5ecef; --muted: #98a7b0; --line: #2b3942; --soft: #1f2c34;
        --accent: #7fb3cc; --accent-ink: #0f171c; --band: #1b3442; --band-ink: #e6f0f5; --band-muted: #9fb7c4;
        --get: #6fb4e0; --post: #7cc18e; --put: #e0b25a; --patch: #c69be0; --delete: #f08a7e; --m-ink: #0f171c;
        --param: #f0a868; --warn-bg: #3a2f14; --warn-ink: #f2cd78; --ok-bg: #173323; --ok-ink: #8fd6a2; --bad-bg: #3d1c19; --bad-ink: #f4a399;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--body); }
    .wrap { max-width: 1180px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
    header { background: var(--band); color: var(--band-ink); }
    header .wrap { padding-block: 22px; display: grid; gap: 4px; }
    h1 { margin: 0; font: 650 26px/1.15 var(--body); }
    .lede { margin: 0; color: var(--band-muted); max-width: 90ch; }
    .lede b { color: var(--band-ink); font-weight: 600; }
    .services { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; padding-block: 16px 4px; }
    .svc { all: unset; cursor: pointer; display: grid; gap: 4px; padding: 11px 13px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
    .svc:hover { border-color: var(--accent); }
    .svc:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .svc[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .svc .n { font: 600 14.5px/1.2 var(--mono); }
    .svc .host { font: 12px/1.3 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
    .svc .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
    .pill { display: inline-flex; padding: 1px 8px; border-radius: 999px; font: 600 11.5px/1.6 var(--body); background: var(--soft); color: var(--ink); white-space: nowrap; }
    .pill.fusion, .pill.other { background: var(--warn-bg); color: var(--warn-ink); }
    .pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
    .pill.bad { background: var(--bad-bg); color: var(--bad-ink); }
    .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
    .bar .wrap { padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #q { flex: 1 1 280px; min-width: 0; font: 14.5px var(--body); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
    .chip { font: 600 12px/1 var(--mono); padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
    .chip[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
    select { font: 14px var(--body); padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
    .count { font-size: 13px; color: var(--muted); margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
    main .wrap { padding-block: 4px 40px; }
    .group h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin: 20px 0 8px; font: 600 16px/1.3 var(--body); }
    .group h2 span { font: 12px var(--mono); color: var(--muted); font-weight: 400; }
    .list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    details { border-top: 1px solid var(--line); }
    details:first-child { border-top: 0; }
    summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 9px 14px; }
    summary::-webkit-details-marker { display: none; }
    summary:hover { background: var(--soft); }
    .m { font: 600 11px/1 var(--mono); text-align: center; padding: 5px 0; border-radius: 6px; color: var(--m-ink); background: var(--get); }
    .m.POST { background: var(--post); } .m.PUT { background: var(--put); } .m.PATCH { background: var(--patch); } .m.DELETE { background: var(--delete); }
    .what { min-width: 0; display: grid; gap: 1px; }
    .path { font: 13px/1.4 var(--mono); overflow-wrap: anywhere; }
    .path i { font-style: normal; color: var(--param); }
    .sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
    .sub code { font: 12px var(--mono); color: var(--ink); }
    .use { font-size: 12px; white-space: nowrap; color: var(--muted); }
    .detail { padding: 2px 14px 14px 96px; display: grid; gap: 12px; }
    .kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 12px; margin: 0; }
    .kv dt { color: var(--muted); font-size: 12.5px; padding-top: 2px; }
    .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .kv code, .files { font: 12.5px/1.5 var(--mono); }
    .files { margin: 0; padding: 0; list-style: none; }
    .test { border: 1px solid var(--line); border-radius: 9px; padding: 12px; display: grid; gap: 10px; background: var(--bg); }
    .test h3 { margin: 0; font: 600 13.5px var(--body); }
    .params { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 12px; }
    .params label { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); min-width: 0; }
    .params label b { color: var(--ink); font: 600 12.5px var(--mono); }
    .params input, .extra { font: 13px var(--mono); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; min-width: 0; }
    .go { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .go .extra { flex: 1 1 260px; width: auto; }
    button.send { font: 600 13px var(--body); padding: 7px 14px; border-radius: 7px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
    button.send:disabled { opacity: .6; cursor: progress; }
    button.small { font: 600 11.5px var(--body); padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
    .sent { font: 12px/1.5 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
    .res { display: grid; gap: 6px; }
    .res .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .res pre { margin: 0; max-height: 420px; overflow: auto; padding: 10px 12px; border-radius: 7px; background: var(--surface); border: 1px solid var(--line); font: 12.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
    .note { font-size: 12.5px; color: var(--muted); margin: 0; }
    .err { color: var(--bad-ink); font-size: 12.5px; }
    .empty { padding: 40px; text-align: center; color: var(--muted); }
    @media (max-width: 700px) { summary { grid-template-columns: 62px minmax(0, 1fr); } .use { grid-column: 2; } .detail { padding-left: 14px; } .kv { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><div class="wrap">
    <h1>EquipRite Web Services</h1>
    <p class="lede" id="lede">Loading the service connections…</p>
  </div></header>
  <div class="wrap"><div class="services" id="services" role="group" aria-label="Filter by service connection"></div></div>
  <div class="bar"><div class="wrap">
    <input id="q" type="search" placeholder="Search path, operation ID or summary (e.g. quote, getRbac, timesheet)" autocomplete="off" aria-label="Search endpoints">
    <div id="methods" role="group" aria-label="Filter by method"></div>
    <select id="usage" aria-label="Filter by use in the app">
      <option value="all">All endpoints</option>
      <option value="used">Called by the app</option>
      <option value="unused">Not referenced</option>
    </select>
    <span class="count" id="count" aria-live="polite"></span>
  </div></div>
  <main><div class="wrap" id="out"></div></main>
  <script src="web-services.js"></script>
</body>
</html>
